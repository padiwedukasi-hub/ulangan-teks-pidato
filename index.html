s melawan kemalasan, kebodohan, dan ketidakjujuran. Pahlawan bagaikan lilin yang menerangi ruangan dengan membakar dirinya sendiri.\nPahlawan masa kini ada di sekitar kita. Petugas kebersihan yang berangkat sebelum subuh agar jalan menuju sekolah bersih adalah pahlawan. Teman yang mau menjelaskan pelajaran kepada temannya yang tertinggal juga pahlawan. Kita pun dapat menjadi pahlawan jika berani jujur saat ulangan, meskipun tidak ada yang mengawasi.\nMarilah kita tanamkan tekad sejak sekarang. Tidak perlu menunggu besar untuk berbuat baik! Pahlawan sejati bukan orang yang paling dikenal, melainkan orang yang paling bermanfaat. Terima kasih atas perhatian Bapak, Ibu, dan teman-teman. Salam sejahtera.", "q": [[11, "Evaluasi – Relevansi Contoh", "Pernyataan <i>Pahlawan sejati bukan orang yang paling dikenal, melainkan orang yang paling bermanfaat</i> paling didukung oleh dua contoh berikut … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Siswa yang membagikan foto kebaikannya agar mendapat banyak suka", "Petugas kebersihan yang berangkat sebelum subuh tanpa sorotan", "Siswa yang membantu temannya yang tertinggal pelajaran", "Tokoh terkenal yang sering tampil di televisi dan media sosial", "Pejabat yang namanya dipasang pada papan peresmian gedung baru"], {"m": [1, 2]}, "Pernyataan itu menekankan manfaat, bukan ketenaran. Petugas kebersihan dan siswa yang membantu temannya bermanfaat tanpa mengejar sorotan. Tokoh terkenal, pejabat dengan papan peresmian, dan siswa yang memamerkan kebaikan justru menonjolkan ketenaran."], [12, "Tekstual – Urutan Pembuka", "Urutan bagian pembuka pidato tersebut yang benar adalah …", ["Salam – sapaan – pengantar topik – puji syukur", "Sapaan – salam – puji syukur – pengantar topik", "Salam – puji syukur – sapaan – pengantar topik", "Salam – sapaan – puji syukur – pengantar topik", "Puji syukur – salam – sapaan – pengantar topik"], 3, "Paragraf pertama dimulai dengan salam (<i>selamat pagi dan salam sejahtera</i>), disusul sapaan kepada kepala sekolah, guru, dan teman-teman, lalu puji syukur, dan diakhiri pengantar topik tentang Hari Pahlawan."], [13, "Evaluasi – Gestur dan Vokal", "Saat mengucapkan kalimat <i>Tidak perlu menunggu besar untuk berbuat baik!</i>, gestur dan vokal yang paling tepat adalah …", ["Tangan menyilang di dada, tempo sangat cepat, dan wajah datar", "Kepalan ringan, intonasi tegas, dan pandangan menyapu audiens", "Tangan di saku, suara pelan, dan pandangan menunduk ke lantai", "Menunjuk satu siswa dengan jari sambil berbicara dengan marah", "Membaca naskah tanpa jeda dengan suara datar dan sangat rendah"], 1, "Kalimat ini berisi ajakan yang menegaskan tekad. Kepalan ringan, intonasi tegas, dan kontak mata yang menyapu audiens menguatkan pesan tanpa menyudutkan siapa pun. Opsi lain menunjukkan keraguan, kemarahan, atau sikap tertutup."], [14, "Inferensial – Makna Perumpamaan", "Perumpamaan <i>lilin yang menerangi ruangan dengan membakar dirinya sendiri</i> menggambarkan sikap pahlawan yang …", ["rela berkorban untuk kebaikan orang di sekitarnya", "menyerah ketika tenaganya habis terpakai bekerja", "bekerja sendirian tanpa mau dibantu oleh siapa pun", "gemar memamerkan jasanya agar mendapat pujian orang", "hanya peduli pada keselamatan dirinya sendiri saja"], 0, "Lilin memberi terang dengan mengorbankan dirinya. Perbandingan itu memaknai pahlawan sebagai orang yang rela berkorban demi orang lain. Sikap pamer, menyerah, atau mementingkan diri bertentangan dengan makna tersebut."], [15, "Inferensial – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Contoh petugas kebersihan dan teman yang membantu dipakai untuk menunjukkan bahwa pahlawan ada di sekitar kita.", "Pembicara berpendapat bahwa perjuangan para pahlawan telah berakhir setelah kemerdekaan.", "Kejujuran saat ulangan dianggap bukan bentuk kepahlawanan karena tidak dilihat orang lain.", "Pembicara mengajak audiens menanamkan tekad sejak sekarang tanpa menunggu dewasa."], [1, 0, 0, 1], "1 Sesuai: contoh itu ada pada paragraf ketiga. 2 Tidak sesuai: pembicara menyatakan perjuangan belum selesai. 3 Tidak sesuai: kejujuran saat ulangan justru disebut sebagai contoh pahlawan. 4 Sesuai: pembicara mengajak menanamkan tekad sejak sekarang dan tidak perlu menunggu besar.", ["Sesuai", "Tidak Sesuai"]]]}, {"t": "Lindungi Data Pribadimu", "k": "Pidato · Persuasif", "p": "<b>Lindungi Data Pribadimu, Lindungi Masa Depanmu</b>\nAssalamualaikum wr. wb. Yang terhormat Bapak Kepala SMK Telkom Purwokerto, yang saya hormati Bapak/Ibu Guru, serta yang saya banggakan teman-teman sekalian. Puji syukur kita panjatkan ke hadirat Tuhan Yang Maha Esa atas rahmat-Nya sehingga kita dapat berkumpul di sini. Pada kesempatan ini, izinkan saya menyampaikan pidato tentang pentingnya menjaga keamanan data pribadi di era digital.\nTeman-teman, setiap hari kita membagikan nama, foto, dan lokasi di media sosial tanpa berpikir panjang. Padahal, kebocoran data pribadi terus meningkat dan sering dimanfaatkan untuk penipuan. Satu tautan palsu atau <i>phishing</i> dapat membuat akun kita diambil alih orang lain. Sebagai contoh, seorang siswa kehilangan akun gim karena mengeklik hadiah palsu. Apakah kita mau menjadi korban berikutnya?\nOleh karena itu, mari kita biasakan menggunakan kata sandi yang kuat dan mengaktifkan autentikasi dua faktor. Jangan sembarangan membagikan kode verifikasi kepada siapa pun! Kita harus menyadari bahwa data pribadi sama berharganya dengan uang di dalam dompet.\nDemikian yang dapat saya sampaikan. Intinya, lindungi data pribadi sebelum terlambat. Mohon maaf atas segala kekhilafan. Wassalamualaikum wr. wb.", "q": [[16, "Tekstual – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Pembicara menyimpulkan bahwa semua pengguna media sosial pasti tertipu berdasarkan satu contoh siswa.", "Anjuran pada paragraf ketiga disampaikan sebagai tindak lanjut atas masalah pada paragraf kedua.", "Pidato memuat angka statistik kebocoran data pribadi secara rinci.", "Perbandingan data pribadi dengan uang di dalam dompet menekankan bahwa data harus dijaga."], [0, 1, 0, 1], "1 Tidak sesuai: pembicara hanya memberi satu contoh dan tidak menyimpulkan bahwa semua pengguna pasti tertipu. 2 Sesuai: <i>oleh karena itu</i> menandai anjuran sebagai tindak lanjut masalah. 3 Tidak sesuai: teks tidak memuat angka. 4 Sesuai: perbandingan dengan uang di dompet menekankan nilai data.", ["Sesuai", "Tidak Sesuai"]], [17, "Inferensial – Fungsi Kalimat Retoris", "Kalimat tanya <i>Apakah kita mau menjadi korban berikutnya?</i> pada paragraf kedua berfungsi …", ["menyimpulkan seluruh isi pidato sebelum bagian penutup", "meminta audiens menjawab pertanyaan itu secara lisan", "menanyakan siapa saja yang pernah kehilangan akun gim", "mendorong audiens membayangkan risiko bagi dirinya", "menyindir siswa yang ceroboh mengeklik hadiah palsu"], 3, "Kalimat retoris tidak menuntut jawaban. Ditempatkan setelah contoh kasus, kalimat ini membuat risiko terasa dekat dan mengajak audiens merenung. Pembicara tidak menanyakan siapa korbannya dan tidak menyindir siapa pun."], [18, "Evaluasi – Penguatan Argumen", "Agar ajakan pada paragraf ketiga lebih meyakinkan, dua tambahan yang paling tepat adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Daftar nama siswa yang pernah menjadi korban penipuan", "Langkah praktis mengenali tautan palsu sebelum diklik", "Data kasus penipuan daring dari lembaga resmi", "Cerita lucu tentang kebiasaan berswafoto di sekolah", "Pengulangan salam pembuka agar audiens lebih tenang"], {"m": [1, 2]}, "Ajakan menjadi kuat bila ditopang bukti (data resmi) dan cara yang dapat dilakukan (langkah praktis). Cerita lucu dan pengulangan salam tidak menambah daya yakin, sedangkan menyebut nama korban justru melanggar pesan pidato tentang menjaga data pribadi."], [19, "Evaluasi – Kelemahan Argumen", "Pernyataan <i>kebocoran data pribadi terus meningkat</i> pada paragraf kedua belum sepenuhnya meyakinkan karena …", ["disampaikan dengan bahasa yang terlalu baku dan kaku", "hanya berlaku bagi siswa yang bermain gim daring", "tidak berkaitan dengan topik keamanan data pribadi", "tidak disertai data atau sumber yang dapat diperiksa", "bertentangan dengan ajakan pada paragraf ketiga"], 3, "Klaim tentang kecenderungan baru kuat bila ada angka atau sumber. Teks tidak memuatnya, sehingga klaim itu masih berupa pengakuan pembicara. Klaim itu tetap relevan dengan topik dan tidak bertentangan dengan paragraf ketiga."], [20, "Tekstual – Gagasan Utama", "Gagasan utama pidato tersebut adalah …", ["Risiko kecanduan gim daring pada pelajar SMK", "Kewajiban sekolah menyediakan jaringan internet gratis", "Manfaat autentikasi dua faktor bagi perusahaan besar", "Cara memilih akun media sosial yang menarik bagi pengikut", "Pentingnya menjaga data pribadi di dunia digital"], 4, "Pengantar topik pada paragraf pertama dan kalimat penutup <i>lindungi data pribadi sebelum terlambat</i> sama-sama menegaskan inti pidato. Opsi lain hanya menyentuh rincian atau topik di luar teks."]]}, {"t": "Kurangi Plastik, Mulai dari Kantin Kita", "k": "Pidato · Argumentatif", "p": "<b>Kurangi Plastik, Mulai dari Kantin Kita</b>\nAssalamualaikum wr. wb. Yang terhormat Bapak Kepala SMK Telkom Purwokerto, yang saya hormati Bapak/Ibu Guru, dan yang saya banggakan seluruh siswa. Puji syukur kita panjatkan ke hadirat Tuhan Yang Maha Esa. Pada kesempatan ini, saya selaku Ketua OSIS akan berbicara tentang sampah plastik di kantin sekolah kita.\nSetiap jam istirahat, ratusan siswa membeli makanan dan minuman dalam kemasan plastik sekali pakai. Menurut catatan petugas kebersihan, kantin menghasilkan rata-rata 30 kantong besar sampah setiap pekan, dan sebagian besar berupa plastik. Memang, sebagian siswa sudah membuang sampah pada tempatnya. Namun, karena tempat sampah di kantin sering penuh, saya menyimpulkan bahwa seluruh siswa tidak peduli pada lingkungan.\nSampah plastik sulit terurai. Jika dibiarkan, sampah itu dapat menyumbat selokan di sekitar sekolah dan menimbulkan genangan saat hujan. Karena itu, OSIS mengusulkan dua langkah, yaitu membawa botol minum sendiri dan memakai wadah makanan yang dapat dicuci ulang.\nMarilah kita mulai dari diri sendiri. Jangan menunggu orang lain bergerak lebih dahulu! Jika kita bersatu, kantin kita pasti menjadi contoh bagi sekolah lain. Demikian yang dapat saya sampaikan. Mohon maaf atas segala kekurangan. Wassalamualaikum wr. wb.", "q": [[21, "Evaluasi – Kelayakan Usulan", "Agar usulan OSIS pada paragraf ketiga lebih meyakinkan dan mudah dilaksanakan, dua tambahan yang paling tepat adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Larangan membawa makanan dan minuman ke lingkungan sekolah", "Jadwal dan penanggung jawab kegiatan membawa botol minum", "Rincian biaya serta lokasi tempat pengisian air minum", "Sanksi berat bagi seluruh siswa sejak hari pertama diumumkan", "Kutipan lagu populer tentang keindahan alam"], {"m": [1, 2]}, "Usulan yang baik harus dapat dilaksanakan: perlu jadwal dan penanggung jawab, serta rincian biaya dan fasilitas pendukung. Larangan membawa makanan tidak sejalan dengan usulan, sanksi menyeluruh tanpa persiapan belum adil, dan kutipan lagu tidak menambah kelayakan usulan."], [22, "Tekstual – Informasi Rinci", "Berdasarkan catatan petugas kebersihan, kondisi sampah di kantin sekolah adalah …", ["rata-rata 13 kantong kecil setiap pekan, sebagian besar kertas", "rata-rata 30 kantong besar setiap pekan, sebagian besar plastik", "kurang dari 10 kantong besar setiap pekan, hampir tanpa plastik", "rata-rata 30 kantong besar setiap hari, seluruhnya plastik", "rata-rata 30 kantong besar setiap bulan, terutama sisa makanan"], 1, "Paragraf kedua menyebut rata-rata 30 kantong besar setiap pekan dan sebagian besar berupa plastik. Opsi lain mengubah satuan waktu, jumlah, atau jenis sampah."], [23, "Evaluasi – Kesalahan Penalaran", "Kesimpulan <i>seluruh siswa tidak peduli pada lingkungan</i> pada paragraf kedua kurang kuat karena …", ["kesimpulan itu tidak berkaitan dengan masalah sampah plastik di kantin", "pembicara tidak menyebut jumlah siswa yang membeli makanan di kantin", "kesimpulan itu dikemukakan sebelum pembicara menyebut catatan petugas", "kata <i>kita</i> membuat pembicara terlihat tidak netral terhadap audiens", "tempat sampah yang penuh belum tentu menunjukkan semua siswa abai"], 4, "Tempat sampah penuh dapat disebabkan hal lain (jumlah tempat sampah kurang, jadwal pengangkutan), dan teks sendiri menyatakan sebagian siswa sudah membuang sampah pada tempatnya. Kata <i>seluruh</i> membuat kesimpulan menjadi generalisasi berlebihan."], [24, "Tekstual – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Pembicara memakai catatan petugas kebersihan untuk mendukung masalah yang diangkat.", "Dampak pada selokan dijelaskan sebagai akibat dari sampah plastik yang sulit terurai.", "Pernyataan <i>kantin kita pasti menjadi contoh bagi sekolah lain</i> telah didukung bukti yang kuat dalam pidato.", "Pembicara menyarankan siswa menunggu arahan guru sebelum mulai mengurangi plastik."], [1, 1, 0, 0], "1 Sesuai: catatan petugas kebersihan disebut pada paragraf kedua. 2 Sesuai: sampah sulit terurai dan dapat menyumbat selokan. 3 Tidak sesuai: kata <i>pasti</i> hanya harapan tanpa bukti. 4 Tidak sesuai: pembicara justru berkata jangan menunggu orang lain bergerak lebih dahulu.", ["Sesuai", "Tidak Sesuai"]], [25, "Inferensial – Ide Pokok Paragraf", "Ide pokok paragraf ketiga pidato tersebut adalah …", ["Genangan air saat hujan merupakan masalah paling utama di lingkungan sekolah", "Wadah makanan yang dapat dicuci ulang harus dijual di setiap kantin sekolah", "Selokan di sekitar sekolah perlu dibersihkan secara rutin setiap musim hujan tiba", "Sampah plastik sulit terurai sehingga perlu dikurangi lewat langkah nyata", "Botol minum sendiri jauh lebih murah daripada air minum dalam kemasan plastik"], 3, "Paragraf ketiga memaparkan dampak sampah plastik (sulit terurai, menyumbat selokan) lalu mengusulkan dua langkah untuk menguranginya. Opsi lain hanya mengambil satu rincian atau memuat hal yang tidak dinyatakan."]]}], "TIPS": {"1": "Tentukan makna dari kalimat di sekitar kata itu: apa akibat yang dirasakan pembaca surel?", "2": "Tanyakan: siapa saja yang tercakup oleh kata <i>kita</i>, dan kesan apa yang muncul bagi audiens?", "3": "Fakta dapat dibuktikan. Opini berupa pendapat atau keyakinan dan sering ditandai <i>menurut saya</i> atau <i>saya yakin</i>.", "4": "Bedakan satu kisah dengan data, dan pendapat dengan pernyataan yang lebih ekstrem dari teks.", "5": "Gagasan utama mewakili seluruh teks. Hindari opsi yang hanya rincian atau memutarbalikkan pendapat pembicara.", "6": "Periksa letak paragraf setiap kutipan. Opsi yang benar harus ada di paragraf kedua dan jenis kalimatnya tepat.", "7": "Periksa apakah setiap pernyataan benar-benar terbukti di draf, bukan sekadar masuk akal.", "8": "Bandingkan urutan sapaan di draf dengan urutan jabatan dari tertinggi ke umum, lalu periksa pilihan katanya.", "9": "Cek empat unsur penutup (kesimpulan atau ajakan, maaf, salam penutup) dan ragam bahasanya pada setiap opsi.", "10": "Ide pokok adalah inti yang didukung semua kalimat lain. Bedakan dengan rincian atau solusi yang hanya muncul satu kali.", "11": "Uji tiap contoh: apakah ia menunjukkan manfaat tanpa mengejar ketenaran? Contoh yang justru mengejar ketenaran tidak relevan.", "12": "Baca paragraf pertama kalimat demi kalimat dan beri label tiap bagian sebelum melihat opsi.", "13": "Cocokkan isi kalimat (ajakan yang menegaskan tekad) dengan gestur dan vokal yang mendukung pesan itu.", "14": "Cari apa yang dilakukan lilin, lalu tanyakan sifat manusia apa yang sejajar dengan tindakan itu.", "15": "Bedakan apa yang tertulis dengan apa yang dibalik maknanya. Cari kalimat bukti pada tiap pernyataan.", "16": "Nilai satu pernyataan sekali waktu. Waspadai kata mutlak seperti <i>semua</i> dan <i>pasti</i>, lalu cari buktinya di teks.", "17": "Tanyakan pada diri sendiri: apakah pembicara menunggu jawaban, atau ingin audiens berpikir?", "18": "Pilih tambahan yang menambah bukti atau cara nyata. Waspadai opsi yang bertentangan dengan pesan pidato itu sendiri.", "19": "Klaim yang kuat punya bukti. Periksa apakah teks menyertakan data, angka, atau sumber untuk klaim tersebut.", "20": "Gagasan utama harus mewakili seluruh teks. Periksa apakah pembuka, isi, dan penutup mendukung opsi yang kamu pilih.", "21": "Nilai kelayakan: siapa yang melaksanakan, kapan, dengan biaya dan fasilitas apa? Singkirkan opsi yang tidak realistis.", "22": "Periksa angka, satuan waktu, dan jenis sampah satu per satu. Satu kata yang berbeda cukup membuat opsi salah.", "23": "Hubungkan bukti dan kesimpulan. Tanyakan: adakah penjelasan lain, dan apakah kata <i>seluruh</i> terbukti?", "24": "Cari bukti di teks untuk tiap pernyataan. Harapan atau janji belum tentu didukung bukti.", "25": "Cari inti yang mencakup semua kalimat di paragraf ketiga, bukan satu rincian saja."}, "MK": {"1": "kata", "2": "katagnt", "3": "faktaopini", "4": "isi", "5": "gagasan", "6": "kalimat", "7": "isi", "8": "protokoler", "9": "penutup", "10": "gagasan", "11": "penalaran", "12": "urutan", "13": "gestur", "14": "kiasan", "15": "isi", "16": "isi", "17": "kalimat", "18": "evaluasi", "19": "penalaran", "20": "gagasan", "21": "evaluasi", "22": "isi", "23": "penalaran", "24": "isi", "25": "gagasan"}, "NOM": {"Bahasa Indonesia, Bekal Kita di Dunia Kerja": 1, "Draf Pidato Disiplin Waktu": 2, "Pahlawan di Zaman Kita": 3, "Lindungi Data Pribadimu": 4, "Kurangi Plastik, Mulai dari Kantin Kita": 5}}};
let PID='A';try{const p=localStorage.getItem('ulh-pkg');if(p==='B'||p==='C')PID=p}catch(e){}
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hs(x){let h=2166136261;for(const c of x){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuf(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seedOf(n,pr,k,tg){return hs([n,pr,k,tg].map(x=>String(x).toLowerCase().replace(/\s+/g,' ').trim()).join('|'))||1}
function personalize(P,seed){const r=mul(seed),tp={},mk={};let n=0;const D2=shuf(JSON.parse(JSON.stringify(P.D)),r);

function drawReport(A,c,dry){const ctx=c.getContext('2d'),W=1080,M=56,TX='#161a2b',MU='#5d6480',AC='#4f46e5';let y=0;
 const F=(s,w)=>{ctx.font=`${w||400} ${s}px system-ui,-apple-system,'Segoe UI',sans-serif`};

 const wrap=(t,x,mw,lh)=>{let line='';for(const w of t.split(' ')){const s=line?line+' '+w:w;if(ctx.measureText(s).width>mw&&line){T(line,x);y+=lh;line=w}else line=s}if(line){T(line,x);y+=lh}};

 if(!dry){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,c.height);const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#4338ca');g.addColorStop(1,'#0891b2');ctx.fillStyle=g;ctx.fillRect(0,0,W,190);if(LOGO.complete&&LOGO.naturalWidth){ctx.fillStyle='#fff';ctx.fillRect(W/2-70,148,140,38);ctx.drawImage(LOGO,W/2-56,151,112,32)}}
 ctx.fillStyle='#fff';F(46,800);y=44;T('Hasil Ulangan Harian · Paket '+PID,W/2,'center');F(26,500);y=112;T(simInfo?'Ulangan Harian':'Latihan Soal',W/2,'center');
 y=224;[['Nama',pid.nama||'-'],['No. Presensi',pid.presensi||'-'],['Kelas',pid.kelas||'-'],['Tanggal',pid.tanggal||'-']].forEach(r=>{F(26,700);ctx.fillStyle=MU;T(r[0],M);F(26,400);ctx.fillStyle=TX;wrap(r[1],M+170,W-M*2-170,38)});
 y+=14;ctx.fillStyle=AC;F(130,800);T(String(A.P),W/2,'center');y+=150;ctx.fillStyle=TX;F(30,700);T(`${A.lvl} · Benar ${A.ben} dari ${A.tot} soal · ${A.pt} dari ${A.ptT} poin`,W/2,'center');y+=62;
 const H=t=>{y+=12;F(32,800);ctx.fillStyle=AC;T(t,M);y+=50};
 H('Capaian per kompetensi');
 Object.entries(A.cats).forEach(([n,o])=>{F(25,600);ctx.fillStyle=TX;T(n,M);T(`${o.b}/${o.a} benar`,W-M,'right');y+=36;if(!dry){ctx.fillStyle='#e3e6f2';ctx.fillRect(M,y,W-2*M,18);ctx.fillStyle=AC;ctx.fillRect(M,y,(W-2*M)*A.pct(o.b,o.a)/100,18)}y+=42});
 H('Analisis');F(25,400);ctx.fillStyle=TX;A.an.forEach(t=>{wrap('• '+t,M,W-2*M,36);y+=8});
 H('Rekomendasi belajar');F(25,400);ctx.fillStyle=TX;A.rec.forEach((t,i)=>{wrap(`${i+1}. ${t}`,M,W-2*M,36);y+=8});
 H('Capaian per teks');F(24,400);ctx.fillStyle=TX;wrap(A.per.map(p=>`Teks ${p.no}: ${p.b}/${p.n}`).join('   ·   '),M,W-2*M,36);
 y+=22;if(!dry){ctx.fillStyle='#e3e6f2';ctx.fillRect(M,y,W-2*M,2)}y+=24;F(22,500);ctx.fillStyle=MU;T('Guru pengampu: Prasetyo Adi Wibowo, M.Pd. · SMK Telkom Purwokerto',W/2,'center');y+=64;return y}

function openGuide(){closeOv();const all=D.flatMap(d=>d.q),n=all.length,nb=all.filter(q=>Array.isArray(q[4])).length,nm=all.filter(q=>isM(q)).length,ng=n-nb-nm;

<div class="fb"><b>1. Pilih mode</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li><b>Ulangan harian:</b> waktu berjalan mundur, kunci jawaban baru muncul setelah ujian selesai, dan aturan anti-curang berlaku.</li></ul></div>

<div class="fb" style="margin-top:8px"><b>3. Jenis soal di paket ini</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li><b>Pilihan ganda (${ng} soal, bobot ${BOBOT.pg}):</b> pilih satu jawaban dari opsi A–E.</li><li><b>Pilih dua (${nm} soal, bobot ${BOBOT.m}):</b> pilih tepat dua jawaban, lalu tekan <i>Periksa jawaban</i>. Benar jika kedua pilihan tepat.</li><li><b>Benar/Salah atau Sesuai/Tidak sesuai (${nb} soal, bobot ${BOBOT.k}):</b> jawab semua pernyataan, lalu tekan <i>Periksa jawaban</i>. Benar jika semua pernyataan tepat.</li></ul></div>
<div class="fb" style="margin-top:8px"><b>4. Tiga kompetensi yang diuji</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li><b>Tekstual:</b> menemukan informasi yang tertulis (gagasan utama, makna kata, rincian). Jawabannya ada langsung di teks.</li><li><b>Inferensial:</b> menafsirkan yang tersirat (hubungan antarparagraf, penyebab, prediksi, pesan moral).</li><li><b>Evaluasi dan Apresiasi:</b> menilai teks (kesesuaian, relevansi, pilihan bahasa, kekuatan argumen).</li></ul></div>
<div class="fb" style="margin-top:8px"><b>5. Strategi menjawab</b><ul style="margin:.3em 0 0;padding-left:1.2em"><li>Baca teks dengan memberi label singkat tiap paragraf (misalnya: nilai, masalah, solusi).</li><li>Cari bukti di teks untuk setiap jawaban. Jangan memakai pendapat atau pengetahuan sendiri.</li><li>Coret opsi yang bertentangan dengan teks, memuat hal yang tidak disebut, atau berkata ekstrem (<i>hanya</i>, <i>semua</i>, <i>selalu</i>, <i>tidak pernah</i>).</li><li>Untuk Benar/Salah, nilai satu pernyataan sekali waktu, termasuk alasan setelah kata <i>karena</i>.</li><li>Pada soal bertanda Evaluasi, bandingkan opsi yang mirip dan perhatikan perbedaan kata kecil.</li></ul></div>
