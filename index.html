<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ulangan Harian Bahasa Indonesia</title>
<style>
:root{--bg:#e9ecf2;--cd:#f6f7fa;--tx:#2a3042;--mu:#5f677d;--ac:#5560b5;--bd:#d3d8e3;--ok:#3f8a5e;--no:#b9534f;--hl:#e0e5f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--cd:#171b30;--tx:#eef0fa;--mu:#9aa2c2;--bd:#2a3050;--hl:#1e2347}}
:root[data-theme="dark"]{--bg:#0e1120;--cd:#171b30;--tx:#eef0fa;--mu:#9aa2c2;--bd:#2a3050;--hl:#1e2347}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}
header{background:linear-gradient(135deg,#4a529c,#3f8596);color:#fff;padding:34px 18px 54px;text-align:center}
header h1{margin:.2em 0;font-size:clamp(1.6rem,5vw,2.6rem)}header p{margin:0;opacity:.9}
.bar{position:sticky;top:0;z-index:9;margin:-28px auto 0;max-width:900px;padding:8px 12px;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.bi{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;box-shadow:0 4px 14px rgba(40,50,80,.10)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:6px 13px;font:600 .82rem inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.tabs button.dn::after{content:" ✓";color:var(--ok)}.tabs .on.dn::after{color:#fff}
.st{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mu);gap:8px;flex-wrap:wrap}
main{max-width:900px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin:14px 0}
.pass{background:var(--hl);border-left:4px solid var(--ac)}.pass h2{margin:.1em 0 .4em;font-size:1.25rem}.pass p{margin:.6em 0}
.badge{display:inline-block;font-size:.72rem;font-weight:800;background:var(--ac);color:#fff;padding:2px 10px;border-radius:99px}
.q b.n{color:var(--ac)}.kt{font-size:.78rem;color:var(--mu)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:12px;padding:10px 13px;margin:7px 0;cursor:pointer;font:inherit}
.opt:hover:not(:disabled){border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--cd))}.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,var(--cd))}
.fb{margin-top:8px;padding:10px 14px;border-radius:12px;background:var(--hl);font-size:.92rem}
.bs{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin:7px 0;flex-wrap:wrap}
.bs span{flex:1 1 260px}.bs button{border:2px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:5px 14px;font:600 .88rem inherit;font-family:inherit;cursor:pointer}
.bs button.sel{border-color:var(--ac);background:var(--hl)}.bs button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--cd))}.bs button.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--cd))}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 18px;font:700 .92rem inherit;font-family:inherit;cursor:pointer}.btn.g{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.tipw{margin-top:10px}.tipb{padding:6px 14px;font-size:.84rem}
.tm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--mu);margin:2px 0 8px}.tm .clk{font-variant-numeric:tabular-nums;font-weight:700;color:var(--tx);background:var(--hl);padding:1px 10px;border-radius:99px}.tm.over .clk{color:var(--no)}.tmb{padding:3px 12px;font-size:.8rem}.tm .res{font-weight:600}
.mt{margin-top:8px;border-left:4px solid var(--ac)}
.seg2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.seg2 button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:5px 12px;font:600 .8rem inherit;font-family:inherit;cursor:pointer}.seg2 button.on{background:var(--ac);color:#fff;border-color:var(--ac)}#clock{font-weight:700;font-variant-numeric:tabular-nums;margin-left:auto}
.opt.sel{border-color:var(--ac);background:var(--hl)}#app.sim .tm,#app.sim .tipw,#app.sim [data-chk]{display:none}.rb{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:4px}.rb i{display:block;height:100%;background:var(--ac)}
.nv{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}.nv button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:5px 0;font:600 .8rem inherit;font-family:inherit;cursor:pointer}.nv .ok{background:color-mix(in srgb,var(--ok) 25%,var(--cd));border-color:var(--ok)}.nv .no{background:color-mix(in srgb,var(--no) 25%,var(--cd));border-color:var(--no)}.nv .sel{background:var(--hl);border-color:var(--ac)}.nv .fg{outline:2px solid #f59e0b}.flg{padding:2px 10px;font-size:.78rem}.flg.on{background:#fef3c7;color:#78350f;border-color:#f59e0b}
.pass h2{text-align:center}.pass>.badge{display:table;margin:0 auto}.pass p:first-of-type{text-align:center;font-size:1.08rem}
.bar.mini .st{display:none}.tabs{overflow:visible}#tabs select{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:600 .85rem inherit;font-family:inherit}
.qh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}.qn{background:var(--ac);color:#fff;font-weight:800;border-radius:10px;padding:2px 12px;font-size:1.05rem}.qh .kt{flex:1 1 140px}.qh .tm{margin:0}.qt{font-size:1.06rem;line-height:1.7;margin:.4em 0 .8em}.flg{margin-left:auto}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:16px}.ovb{background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:20px;max-width:480px;width:100%;max-height:85vh;overflow:auto}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:3px 10px;font:600 .8rem inherit;font-family:inherit;cursor:pointer}
#app{font-size:calc(1rem*var(--fz,1))}.qt{font-size:1.06em}.fb,.tip{font-size:.92em}
.ring{width:140px;height:140px;border-radius:50%;margin:8px auto;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center}.ring span{width:112px;height:112px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-size:2.6rem;font-weight:800;color:var(--ac)}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes fadein{from{opacity:0;transform:translateY(4px)}}.opt.ok{animation:pop .35s}.opt.no{animation:shake .35s}.fb{animation:fadein .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:1000px){.bar,main{max-width:1240px}#app.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:0 20px;align-items:start}#app.two>details{grid-column:1/-1}#app.two>.pass{grid-column:1;grid-row:2/span 30;position:sticky;top:150px;max-height:calc(100vh - 170px);overflow:auto}#app.two>.q{grid-column:2}#app.two>.pn{grid-column:1/-1}}
body.cbt{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}body.cbt header{padding:8px 14px 34px}body.cbt header h1{font-size:1.15rem;margin:0}body.cbt header .badge,body.cbt header p:first-of-type,body.cbt footer,body.cbt .st{display:none}body.cbt header p{margin:0;font-size:.75rem}
body.cbt .bar{margin-top:-22px;padding:4px 12px}body.cbt .bi{padding:6px 10px}body.cbt .seg2{margin-bottom:6px}
body.cbt main{flex:1;min-height:0;width:100%;max-width:1240px;margin:0 auto;padding:6px 12px 10px;overflow:hidden}
#app.cb{height:100%;display:flex;flex-direction:column;gap:8px}.pane{display:none;min-height:0;overflow:auto}.pane.show{display:block;flex:1}.pane .card{margin:0 0 10px}.vsw{display:flex;gap:6px}.vsw button{flex:1;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:7px;font:700 .85rem inherit;font-family:inherit;cursor:pointer}.vsw button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.qnav{display:flex;gap:8px;justify-content:space-between}.qnav .btn{flex:1}.qnav .btn:disabled{opacity:.4}
@media(min-width:1000px){#app.cb{display:grid;grid-template-columns:5fr 6fr;grid-template-rows:minmax(0,1fr) auto;gap:12px 14px}.vsw{display:none}.pane{display:block!important}.qnav{grid-column:1/-1;max-width:520px;margin:0 auto;width:100%}}
#app.cb{display:flex!important;flex-direction:column;gap:8px}.pane{display:block!important;overflow:auto;min-height:0}.pane.top{flex:0 0 var(--top,42%)}.pane.bot{flex:1 1 0}.vsw{display:flex!important;justify-content:flex-end}.vsw button{flex:0 0 auto;padding:4px 12px;font-size:.78rem}.qnav{max-width:none;margin:0;width:auto}
label{font-weight:600;font-size:.9rem}.inp{display:block;width:100%;margin:4px 0 12px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}.tip{margin-top:8px;padding:10px 14px;border-radius:12px;border:1px dashed var(--ac);background:var(--hl);font-size:.92rem}

@media(max-width:600px){
header{padding:16px 14px 40px}header h1{font-size:1.3rem;line-height:1.25;margin:.3em 0 .15em}header p{font-size:.85rem;line-height:1.4}header>p:last-of-type{display:none}
header .badge{font-size:.68rem}
.bar{margin-top:-24px;padding:6px 8px;padding-top:calc(env(safe-area-inset-top,0px) + 6px)}.bi{padding:8px 10px;border-radius:14px}
.seg2{flex-wrap:nowrap;overflow-x:auto;gap:5px;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.seg2::-webkit-scrollbar{display:none}
.seg2 button{flex:none;white-space:nowrap;padding:6px 11px;font-size:.78rem}
#clock{flex:none;white-space:nowrap}
#tabs select{padding:8px 10px;font-size:.84rem}
.st{font-size:.78rem}.st .btn{padding:3px 10px;font-size:.74rem}
.st .btn{min-height:0}
.bar.mini .seg2>button:not(#fin-sim){display:none}.bar.mini .seg2{margin-bottom:4px}
main{padding:10px 10px 50px}
.card{padding:14px 14px;border-radius:14px;margin:12px 0}
.pass h2{font-size:1.1rem}
.qh{gap:8px}.qh .kt{flex:1 1 100px;font-size:.74rem}.qn{font-size:.95rem;padding:2px 10px}
.qh .tm{order:5;flex:1 1 100%;margin:0}
.qt{font-size:1rem;line-height:1.6}
.opt{padding:12px 12px;margin:8px 0;font-size:.97em;line-height:1.5;min-height:48px;-webkit-tap-highlight-color:transparent}
.bs{padding:10px 12px;gap:10px}.bs span{flex:1 1 100%;line-height:1.5}.bs>div{display:flex;gap:8px;width:100%}.bs button{flex:1;padding:10px 6px;min-height:44px;font-size:.9rem}
.btn{min-height:44px}.btn.flg,.btn.tmb,.btn.tipb{min-height:34px}
[data-chk]{width:100%;margin-top:6px}
.pn{flex-direction:column-reverse}.pn .btn{width:100%}
.nv{grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}.nv button{padding:8px 0}
.ovb{padding:16px;max-height:88vh}
footer{font-size:.78rem!important}
}
.mh{margin:0 0 6px;font-size:.8rem;color:var(--ac);font-weight:700}
.opt{touch-action:manipulation}.bs button,.btn,.chip{touch-action:manipulation}
.opt.sel::after{content:" ✓";color:var(--ac);font-weight:800}
.opt.ok.sel::after,.opt.no.sel::after{content:""}

/* ukuran font minimum (lebih besar dan nyaman dibaca) */
body{font-size:17px}
#app{font-size:calc(1.06rem*var(--fz,1.1))}
.qt{font-size:1.12em;line-height:1.6}.opt{font-size:1.04em}.fb,.tip{font-size:1em}.pass p{font-size:1.02em}.pass p:first-of-type{font-size:1.12em}.pass h2{font-size:1.3rem}
.qn{font-size:1.1rem}.badge,header .badge{font-size:.82rem}
.kt,.qh .kt,.tm,.mh,label,.st,.st .btn,.tmb,.tipb,.flg,.chip,.nv button{font-size:.92rem}
.tabs button,.seg2 button,#tabs select,.vsw button,.bs button,.btn{font-size:.95rem}
header p,body.cbt header p{font-size:.95rem}
footer{font-size:.9rem!important}
#app.sim{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[data-mode="latihan"],#rs,#pksel,[data-reset]{display:none!important}body.cbt #adm{display:none}.mnote{display:inline-block;margin-left:6px;padding:1px 10px;border-radius:99px;background:var(--hl);border:1px solid var(--ac);color:var(--ac);font-weight:800;font-size:.82em;white-space:nowrap}
.mh{display:inline-block;background:var(--hl);border:1px solid var(--ac);border-radius:10px;padding:5px 12px;margin:4px 0 8px;font-size:.95rem}
</style>
</head>

<script>
// Paket A (25 soal: 5 teks × 5 soal). Format soal: [no, kompetensi, pertanyaan, [opsi], indeks jawaban, pembahasan] ; Benar/Salah: [no, kompetensi, pertanyaan, [pernyataan], [1=Benar/0=Salah], pembahasan]
// Pilih DUA: [no, kompetensi, pertanyaan, [opsi], {m:[indeks benar]}, pembahasan]. Benar/Salah dapat membawa label ke-7: ["Sesuai","Tidak Sesuai"].
const PK={"A": {"D": [{"t": "Lindungi Data Pribadimu", "k": "Pidato · Persuasif", "p": "<b>Lindungi Data Pribadimu, Lindungi Masa Depanmu</b>\nAssalamualaikum wr. wb. Yang terhormat Bapak Kepala SMK Telkom Purwokerto, yang saya hormati Bapak/Ibu Guru, serta yang saya banggakan teman-teman sekalian. Puji syukur kita panjatkan ke hadirat Tuhan Yang Maha Esa atas rahmat-Nya sehingga kita dapat berkumpul di sini. Pada kesempatan ini, izinkan saya menyampaikan pidato tentang pentingnya menjaga keamanan data pribadi di era digital.\nTeman-teman, setiap hari kita membagikan nama, foto, dan lokasi di media sosial tanpa berpikir panjang. Padahal, kebocoran data pribadi terus meningkat dan sering dimanfaatkan untuk penipuan. Satu tautan palsu atau <i>phishing</i> dapat membuat akun kita diambil alih orang lain. Sebagai contoh, seorang siswa kehilangan akun gim karena mengeklik hadiah palsu. Apakah kita mau menjadi korban berikutnya?\nOleh karena itu, mari kita biasakan menggunakan kata sandi yang kuat dan mengaktifkan autentikasi dua faktor. Jangan sembarangan membagikan kode verifikasi kepada siapa pun! Kita harus menyadari bahwa data pribadi sama berharganya dengan uang di dalam dompet.\nDemikian yang dapat saya sampaikan. Intinya, lindungi data pribadi sebelum terlambat. Mohon maaf atas segala kekhilafan. Wassalamualaikum wr. wb.", "q": [[1, "Tekstual – Gagasan Utama", "Gagasan utama pidato tersebut adalah …", ["Pentingnya menjaga data pribadi di dunia digital", "Manfaat autentikasi dua faktor bagi perusahaan besar", "Cara memilih akun media sosial yang menarik bagi pengikut", "Risiko kecanduan gim daring pada pelajar SMK", "Kewajiban sekolah menyediakan jaringan internet gratis"], 0, "Pengantar topik pada paragraf pertama dan kalimat penutup <i>lindungi data pribadi sebelum terlambat</i> sama-sama menegaskan inti pidato. Opsi lain hanya menyentuh rincian atau topik di luar teks."], [2, "Inferensial – Fungsi Kalimat Retoris", "Kalimat tanya <i>Apakah kita mau menjadi korban berikutnya?</i> pada paragraf kedua berfungsi …", ["meminta audiens menjawab pertanyaan itu secara lisan", "menanyakan siapa saja yang pernah kehilangan akun gim", "menyindir siswa yang ceroboh mengeklik hadiah palsu", "mendorong audiens membayangkan risiko bagi dirinya", "menyimpulkan seluruh isi pidato sebelum bagian penutup"], 3, "Kalimat retoris tidak menuntut jawaban. Ditempatkan setelah contoh kasus, kalimat ini membuat risiko terasa dekat dan mengajak audiens merenung. Pembicara tidak menanyakan siapa korbannya dan tidak menyindir siapa pun."], [3, "Evaluasi – Kelemahan Argumen", "Pernyataan <i>kebocoran data pribadi terus meningkat</i> pada paragraf kedua belum sepenuhnya meyakinkan karena …", ["bertentangan dengan ajakan pada paragraf ketiga", "tidak disertai data atau sumber yang dapat diperiksa", "tidak berkaitan dengan topik keamanan data pribadi", "disampaikan dengan bahasa yang terlalu baku dan kaku", "hanya berlaku bagi siswa yang bermain gim daring"], 1, "Klaim tentang kecenderungan baru kuat bila ada angka atau sumber. Teks tidak memuatnya, sehingga klaim itu masih berupa pengakuan pembicara. Klaim itu tetap relevan dengan topik dan tidak bertentangan dengan paragraf ketiga."], [4, "Evaluasi – Penguatan Argumen", "Agar ajakan pada paragraf ketiga lebih meyakinkan, dua tambahan yang paling tepat adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Data kasus penipuan daring dari lembaga resmi", "Daftar nama siswa yang pernah menjadi korban penipuan", "Cerita lucu tentang kebiasaan berswafoto di sekolah", "Pengulangan salam pembuka agar audiens lebih tenang", "Langkah praktis mengenali tautan palsu sebelum diklik"], {"m": [0, 4]}, "Ajakan menjadi kuat bila ditopang bukti (data resmi) dan cara yang dapat dilakukan (langkah praktis). Cerita lucu dan pengulangan salam tidak menambah daya yakin, sedangkan menyebut nama korban justru melanggar pesan pidato tentang menjaga data pribadi."], [5, "Tekstual – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Pembicara menyimpulkan bahwa semua pengguna media sosial pasti tertipu berdasarkan satu contoh siswa.", "Anjuran pada paragraf ketiga disampaikan sebagai tindak lanjut atas masalah pada paragraf kedua.", "Pidato memuat angka statistik kebocoran data pribadi secara rinci.", "Perbandingan data pribadi dengan uang di dalam dompet menekankan bahwa data harus dijaga."], [0, 1, 0, 1], "1 Tidak sesuai: pembicara hanya memberi satu contoh dan tidak menyimpulkan bahwa semua pengguna pasti tertipu. 2 Sesuai: <i>oleh karena itu</i> menandai anjuran sebagai tindak lanjut masalah. 3 Tidak sesuai: teks tidak memuat angka. 4 Sesuai: perbandingan dengan uang di dompet menekankan nilai data.", ["Sesuai", "Tidak Sesuai"]]]}, {"t": "Draf Pidato Disiplin Waktu", "k": "Pidato · Draf Siswa", "p": "<b>Draf Pidato Lomba: Disiplin Waktu</b>\nHai teman-teman, yang saya cintai Bapak Kepala Sekolah, dan Bapak Guru. Hari ini saya mau ngomongin disiplin waktu.\nBanyak siswa datang terlambat karena begadang. Akibatnya, pelajaran pertama sering terlewat dan nilai menurun. Bukankah kita ingin lulus dengan prestasi yang membanggakan? Marilah kita tiba di sekolah sebelum bel berbunyi dan tidur lebih awal. Kita pasti bisa!\nUdah ya, itu aja dari saya. Makasih.", "q": [[6, "Tekstual – Kesalahan Pembuka", "Kesalahan yang paling jelas pada sapaan di bagian pembuka draf pidato tersebut adalah …", ["Sapaan tidak berurutan dari jabatan tertinggi dan memakai kata tidak formal", "Sapaan terlalu panjang sehingga topik pidato baru disebut pada bagian akhir", "Sapaan tidak memuat nama sekolah tempat lomba pidato itu diselenggarakan", "Sapaan hanya ditujukan kepada kepala sekolah dan guru, tanpa menyapa audiens lain", "Sapaan memakai bahasa daerah yang tidak dikenal oleh sebagian besar audiens"], 0, "Kata <i>teman-teman</i> disebut lebih dulu daripada <i>Bapak Kepala Sekolah</i> dan <i>Bapak Guru</i> (urutan terbalik), serta dipakai kata <i>hai</i> dan <i>ngomongin</i> yang tidak formal. Sapaan itu tetap menyapa audiens dan topik sudah disebut di kalimat berikutnya."], [7, "Inferensial – Ide Pokok Paragraf", "Ide pokok paragraf kedua draf tersebut adalah …", ["Nilai siswa menurun karena materi pelajaran terlalu sulit", "Guru wajib menertibkan siswa yang datang terlambat", "Bel sekolah sebaiknya dibunyikan lebih awal setiap hari", "Siswa perlu tidur lebih awal agar tubuhnya tetap sehat", "Keterlambatan akibat begadang merugikan prestasi siswa"], 4, "Paragraf kedua bergerak dari masalah (terlambat karena begadang) ke akibat (pelajaran terlewat, nilai menurun), lalu ajakan. Semuanya mendukung satu ide: keterlambatan akibat begadang merugikan prestasi. Tidur lebih awal hanya salah satu solusi pendukung."], [8, "Tekstual – Unsur Kebahasaan", "Dua pernyataan tentang unsur kebahasaan yang tepat berdasarkan paragraf kedua draf adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Terdapat kata ganti orang ketiga pada kata <i>kita</i> dalam kalimat <i>Marilah kita tiba</i>", "Terdapat sapaan akrab <i>hai</i> pada kalimat pembuka paragraf kedua ini", "Terdapat kalimat retoris <i>Bukankah kita ingin lulus dengan prestasi yang membanggakan?</i>", "Terdapat kalimat imperatif <i>Marilah kita tiba di sekolah sebelum bel berbunyi</i>", "Terdapat bahasa tidak baku pada kalimat <i>Hari ini saya mau ngomongin disiplin waktu</i> di paragraf ini"], {"m": [2, 3]}, "Kalimat tanya yang tidak menuntut jawaban adalah kalimat retoris, dan <i>marilah</i> menandai ajakan (imperatif). <i>Ngomongin</i> dan <i>hai</i> berada pada paragraf pertama, bukan paragraf kedua, sedangkan <i>kita</i> adalah kata ganti orang pertama jamak inklusif."], [9, "Evaluasi – Perbaikan Penutup", "Penutup yang paling tepat untuk menggantikan <i>Udah ya, itu aja dari saya. Makasih.</i> adalah …", ["Intinya, disiplin waktu itu penting banget buat kita semua. Sekian dari saya, sampai ketemu lagi. Wassalamualaikum wr. wb.", "Demikian yang dapat saya sampaikan. Terima kasih atas perhatian Bapak, Ibu, dan teman-teman sekalian. Mohon maaf atas kekhilafan.", "Demikian yang dapat saya sampaikan. Mari kita disiplin waktu mulai hari ini. Mohon maaf atas kekhilafan. Wassalamualaikum wr. wb.", "Cukup sekian dan terima kasih. Jangan lupa tidur lebih awal supaya tidak terlambat. Kalau ada salah kata, mohon dimaklumi.", "Sekian pidato saya. Semoga siswa yang suka terlambat segera sadar dan berubah. Terima kasih, silakan bertepuk tangan, ya."], 2, "Penutup baku memuat kesimpulan atau ajakan, permohonan maaf, dan salam penutup dengan bahasa formal. Opsi lain tidak lengkap (tanpa ajakan atau salam penutup), masih memakai bahasa tidak formal, atau menyudutkan siswa tertentu."], [10, "Evaluasi – Kesesuaian Draf", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan tentang draf pidato!", ["Pembuka draf sudah memuat salam, sapaan protokoler, puji syukur, dan pengantar topik.", "Kata <i>kita</i> pada <i>Marilah kita</i> menyertakan pembicara bersama audiens.", "Kalimat <i>Bukankah kita ingin lulus dengan prestasi yang membanggakan?</i> mengajak audiens berpikir tanpa menuntut jawaban.", "Pernyataan <i>nilai menurun</i> sudah didukung data nilai siswa yang sering terlambat."], [0, 1, 1, 0], "1 Tidak sesuai: salam dan puji syukur tidak ada, dan sapaan belum berurutan. 2 Sesuai: <i>kita</i> bersifat inklusif. 3 Sesuai: kalimat tanya itu retoris. 4 Tidak sesuai: draf tidak memuat data nilai, hanya pernyataan.", ["Sesuai", "Tidak Sesuai"]]]}, {"t": "Kurangi Plastik, Mulai dari Kantin Kita", "k": "Pidato · Argumentatif", "p": "<b>Kurangi Plastik, Mulai dari Kantin Kita</b>\nAssalamualaikum wr. wb. Yang terhormat Bapak Kepala SMK Telkom Purwokerto, yang saya hormati Bapak/Ibu Guru, dan yang saya banggakan seluruh siswa. Puji syukur kita panjatkan ke hadirat Tuhan Yang Maha Esa. Pada kesempatan ini, saya selaku Ketua OSIS akan berbicara tentang sampah plastik di kantin sekolah kita.\nSetiap jam istirahat, ratusan siswa membeli makanan dan minuman dalam kemasan plastik sekali pakai. Menurut catatan petugas kebersihan, kantin menghasilkan rata-rata 30 kantong besar sampah setiap pekan, dan sebagian besar berupa plastik. Memang, sebagian siswa sudah membuang sampah pada tempatnya. Namun, karena tempat sampah di kantin sering penuh, saya menyimpulkan bahwa seluruh siswa tidak peduli pada lingkungan.\nSampah plastik sulit terurai. Jika dibiarkan, sampah itu dapat menyumbat selokan di sekitar sekolah dan menimbulkan genangan saat hujan. Karena itu, OSIS mengusulkan dua langkah, yaitu membawa botol minum sendiri dan memakai wadah makanan yang dapat dicuci ulang.\nMarilah kita mulai dari diri sendiri. Jangan menunggu orang lain bergerak lebih dahulu! Jika kita bersatu, kantin kita pasti menjadi contoh bagi sekolah lain. Demikian yang dapat saya sampaikan. Mohon maaf atas segala kekurangan. Wassalamualaikum wr. wb.", "q": [[11, "Tekstual – Informasi Rinci", "Berdasarkan catatan petugas kebersihan, kondisi sampah di kantin sekolah adalah …", ["rata-rata 30 kantong besar setiap bulan, terutama sisa makanan", "kurang dari 10 kantong besar setiap pekan, hampir tanpa plastik", "rata-rata 30 kantong besar setiap pekan, sebagian besar plastik", "rata-rata 30 kantong besar setiap hari, seluruhnya plastik", "rata-rata 13 kantong kecil setiap pekan, sebagian besar kertas"], 2, "Paragraf kedua menyebut rata-rata 30 kantong besar setiap pekan dan sebagian besar berupa plastik. Opsi lain mengubah satuan waktu, jumlah, atau jenis sampah."], [12, "Evaluasi – Kesalahan Penalaran", "Kesimpulan <i>seluruh siswa tidak peduli pada lingkungan</i> pada paragraf kedua kurang kuat karena …", ["kesimpulan itu tidak berkaitan dengan masalah sampah plastik di kantin", "kata <i>kita</i> membuat pembicara terlihat tidak netral terhadap audiens", "pembicara tidak menyebut jumlah siswa yang membeli makanan di kantin", "kesimpulan itu dikemukakan sebelum pembicara menyebut catatan petugas", "tempat sampah yang penuh belum tentu menunjukkan semua siswa abai"], 4, "Tempat sampah penuh dapat disebabkan hal lain (jumlah tempat sampah kurang, jadwal pengangkutan), dan teks sendiri menyatakan sebagian siswa sudah membuang sampah pada tempatnya. Kata <i>seluruh</i> membuat kesimpulan menjadi generalisasi berlebihan."], [13, "Inferensial – Ide Pokok Paragraf", "Ide pokok paragraf ketiga pidato tersebut adalah …", ["Selokan di sekitar sekolah perlu dibersihkan secara rutin setiap musim hujan tiba", "Genangan air saat hujan merupakan masalah paling utama di lingkungan sekolah", "Botol minum sendiri jauh lebih murah daripada air minum dalam kemasan plastik", "Wadah makanan yang dapat dicuci ulang harus dijual di setiap kantin sekolah", "Sampah plastik sulit terurai sehingga perlu dikurangi lewat langkah nyata"], 4, "Paragraf ketiga memaparkan dampak sampah plastik (sulit terurai, menyumbat selokan) lalu mengusulkan dua langkah untuk menguranginya. Opsi lain hanya mengambil satu rincian atau memuat hal yang tidak dinyatakan."], [14, "Evaluasi – Kelayakan Usulan", "Agar usulan OSIS pada paragraf ketiga lebih meyakinkan dan mudah dilaksanakan, dua tambahan yang paling tepat adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Rincian biaya serta lokasi tempat pengisian air minum", "Kutipan lagu populer tentang keindahan alam", "Larangan membawa makanan dan minuman ke lingkungan sekolah", "Jadwal dan penanggung jawab kegiatan membawa botol minum", "Sanksi berat bagi seluruh siswa sejak hari pertama diumumkan"], {"m": [0, 3]}, "Usulan yang baik harus dapat dilaksanakan: perlu jadwal dan penanggung jawab, serta rincian biaya dan fasilitas pendukung. Larangan membawa makanan tidak sejalan dengan usulan, sanksi menyeluruh tanpa persiapan belum adil, dan kutipan lagu tidak menambah kelayakan usulan."], [15, "Tekstual – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Pembicara memakai catatan petugas kebersihan untuk mendukung masalah yang diangkat.", "Dampak pada selokan dijelaskan sebagai akibat dari sampah plastik yang sulit terurai.", "Pernyataan <i>kantin kita pasti menjadi contoh bagi sekolah lain</i> telah didukung bukti yang kuat dalam pidato.", "Pembicara menyarankan siswa menunggu arahan guru sebelum mulai mengurangi plastik."], [1, 1, 0, 0], "1 Sesuai: catatan petugas kebersihan disebut pada paragraf kedua. 2 Sesuai: sampah sulit terurai dan dapat menyumbat selokan. 3 Tidak sesuai: kata <i>pasti</i> hanya harapan tanpa bukti. 4 Tidak sesuai: pembicara justru berkata jangan menunggu orang lain bergerak lebih dahulu.", ["Sesuai", "Tidak Sesuai"]]]}, {"t": "Pahlawan di Zaman Kita", "k": "Pidato · Inspiratif", "p": "<b>Pahlawan di Zaman Kita</b>\nSelamat pagi dan salam sejahtera bagi kita semua. Yang terhormat Bapak Kepala Sekolah, yang saya hormati Bapak/Ibu Guru, dan yang saya sayangi teman-teman. Puji syukur kita panjatkan ke hadirat Tuhan Yang Maha Esa. Dalam rangka Hari Pahlawan, izinkan saya mengajak kita merenungkan arti pahlawan pada zaman ini.\nPara pejuang dahulu mempertaruhkan nyawa agar bangsa ini merdeka. Kini kita tidak lagi mengangkat senjata, tetapi perjuangan belum selesai, sebab kita masih harus melawan kemalasan, kebodohan, dan ketidakjujuran. Pahlawan bagaikan lilin yang menerangi ruangan dengan membakar dirinya sendiri.\nPahlawan masa kini ada di sekitar kita. Petugas kebersihan yang berangkat sebelum subuh agar jalan menuju sekolah bersih adalah pahlawan. Teman yang mau menjelaskan pelajaran kepada temannya yang tertinggal juga pahlawan. Kita pun dapat menjadi pahlawan jika berani jujur saat ulangan, meskipun tidak ada yang mengawasi.\nMarilah kita tanamkan tekad sejak sekarang. Tidak perlu menunggu besar untuk berbuat baik! Pahlawan sejati bukan orang yang paling dikenal, melainkan orang yang paling bermanfaat. Terima kasih atas perhatian Bapak, Ibu, dan teman-teman. Salam sejahtera.", "q": [[16, "Tekstual – Urutan Pembuka", "Urutan bagian pembuka pidato tersebut yang benar adalah …", ["Salam – sapaan – puji syukur – pengantar topik", "Puji syukur – salam – sapaan – pengantar topik", "Sapaan – salam – puji syukur – pengantar topik", "Salam – sapaan – pengantar topik – puji syukur", "Salam – puji syukur – sapaan – pengantar topik"], 0, "Paragraf pertama dimulai dengan salam (<i>selamat pagi dan salam sejahtera</i>), disusul sapaan kepada kepala sekolah, guru, dan teman-teman, lalu puji syukur, dan diakhiri pengantar topik tentang Hari Pahlawan."], [17, "Inferensial – Makna Perumpamaan", "Perumpamaan <i>lilin yang menerangi ruangan dengan membakar dirinya sendiri</i> menggambarkan sikap pahlawan yang …", ["menyerah ketika tenaganya habis terpakai bekerja", "bekerja sendirian tanpa mau dibantu oleh siapa pun", "gemar memamerkan jasanya agar mendapat pujian orang", "hanya peduli pada keselamatan dirinya sendiri saja", "rela berkorban untuk kebaikan orang di sekitarnya"], 4, "Lilin memberi terang dengan mengorbankan dirinya. Perbandingan itu memaknai pahlawan sebagai orang yang rela berkorban demi orang lain. Sikap pamer, menyerah, atau mementingkan diri bertentangan dengan makna tersebut."], [18, "Evaluasi – Gestur dan Vokal", "Saat mengucapkan kalimat <i>Tidak perlu menunggu besar untuk berbuat baik!</i>, gestur dan vokal yang paling tepat adalah …", ["Membaca naskah tanpa jeda dengan suara datar dan sangat rendah", "Tangan di saku, suara pelan, dan pandangan menunduk ke lantai", "Kepalan ringan, intonasi tegas, dan pandangan menyapu audiens", "Menunjuk satu siswa dengan jari sambil berbicara dengan marah", "Tangan menyilang di dada, tempo sangat cepat, dan wajah datar"], 2, "Kalimat ini berisi ajakan yang menegaskan tekad. Kepalan ringan, intonasi tegas, dan kontak mata yang menyapu audiens menguatkan pesan tanpa menyudutkan siapa pun. Opsi lain menunjukkan keraguan, kemarahan, atau sikap tertutup."], [19, "Evaluasi – Relevansi Contoh", "Pernyataan <i>Pahlawan sejati bukan orang yang paling dikenal, melainkan orang yang paling bermanfaat</i> paling didukung oleh dua contoh berikut … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Petugas kebersihan yang berangkat sebelum subuh tanpa sorotan", "Siswa yang membagikan foto kebaikannya agar mendapat banyak suka", "Tokoh terkenal yang sering tampil di televisi dan media sosial", "Siswa yang membantu temannya yang tertinggal pelajaran", "Pejabat yang namanya dipasang pada papan peresmian gedung baru"], {"m": [0, 3]}, "Pernyataan itu menekankan manfaat, bukan ketenaran. Petugas kebersihan dan siswa yang membantu temannya bermanfaat tanpa mengejar sorotan. Tokoh terkenal, pejabat dengan papan peresmian, dan siswa yang memamerkan kebaikan justru menonjolkan ketenaran."], [20, "Inferensial – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Contoh petugas kebersihan dan teman yang membantu dipakai untuk menunjukkan bahwa pahlawan ada di sekitar kita.", "Pembicara berpendapat bahwa perjuangan para pahlawan telah berakhir setelah kemerdekaan.", "Kejujuran saat ulangan dianggap bukan bentuk kepahlawanan karena tidak dilihat orang lain.", "Pembicara mengajak audiens menanamkan tekad sejak sekarang tanpa menunggu dewasa."], [1, 0, 0, 1], "1 Sesuai: contoh itu ada pada paragraf ketiga. 2 Tidak sesuai: pembicara menyatakan perjuangan belum selesai. 3 Tidak sesuai: kejujuran saat ulangan justru disebut sebagai contoh pahlawan. 4 Sesuai: pembicara mengajak menanamkan tekad sejak sekarang dan tidak perlu menunggu besar.", ["Sesuai", "Tidak Sesuai"]]]}, {"t": "Bahasa Indonesia, Bekal Kita di Dunia Kerja", "k": "Pidato · Argumentatif", "p": "<b>Bahasa Indonesia, Bekal Kita di Dunia Kerja</b>\nAssalamualaikum wr. wb. Yang terhormat Bapak Kepala Sekolah dan Bapak/Ibu Guru, serta yang saya banggakan teman-teman sekalian. Puji syukur kita panjatkan kepada Tuhan Yang Maha Esa. Pada kesempatan ini, saya ingin berbicara tentang pentingnya kemampuan berbahasa Indonesia bagi calon pekerja seperti kita.\nBanyak orang menganggap bahasa Indonesia mudah karena kita memakainya setiap hari. Padahal, bahasa sehari-hari berbeda dengan bahasa di dunia kerja. Surel lamaran yang penuh singkatan dan salah ketik membuat pembaca ragu sehingga dapat menurunkan kredibilitas pelamar. Seorang manajer perekrutan pernah menolak lamaran yang diawali sapaan <i>halo, Bos</i>.\nBahasa Indonesia ditetapkan sebagai bahasa negara dalam Undang-Undang Dasar 1945. Menurut saya, kemampuan menulis lebih penting daripada keterampilan teknis. Saya yakin, pelamar yang menulis dengan rapi pasti lebih cepat diterima. Lamaran kerja pun umumnya dilengkapi daftar riwayat hidup.\nJika kita ingin dipercaya, kita harus membiasakan diri menulis dengan baik mulai sekarang. Demikian yang dapat saya sampaikan. Mohon maaf atas segala kekhilafan. Wassalamualaikum wr. wb.", "q": [[21, "Tekstual – Makna Kata", "Makna kata <i>kredibilitas</i> dalam kalimat <i>…dapat menurunkan kredibilitas pelamar</i> adalah …", ["kemampuan berbicara lancar di hadapan banyak orang", "kecepatan seseorang dalam mengetik surat lamaran", "jumlah pengalaman kerja yang pernah dimiliki pelamar", "tingkat kepercayaan orang lain terhadap seseorang", "kerapian penampilan pelamar saat menjalani wawancara"], 3, "Kalimat itu menyebut surel penuh singkatan dan salah ketik membuat pembaca ragu. Maka <i>kredibilitas</i> berarti tingkat kepercayaan orang lain terhadap pelamar."], [22, "Tekstual – Gagasan Utama", "Gagasan utama pidato tersebut adalah …", ["Keterampilan teknis tidak lagi diperlukan dalam bekerja", "Kemampuan berbahasa Indonesia penting bagi calon pekerja", "Cara menulis surel lamaran dengan singkatan yang tepat", "Sejarah penetapan bahasa Indonesia sebagai bahasa negara", "Aturan menyusun daftar riwayat hidup yang menarik"], 1, "Pembuka, isi, dan penutup berpusat pada pentingnya berbahasa dan menulis dengan baik untuk dunia kerja. Opsi lain hanya rincian (UUD 1945, daftar riwayat hidup), tidak dinyatakan (singkatan yang tepat), atau memutarbalikkan pendapat pembicara."], [23, "Inferensial – Kata Ganti", "Pemakaian kata <i>kita</i> pada kalimat <i>Jika kita ingin dipercaya, kita harus membiasakan diri menulis dengan baik</i> menunjukkan bahwa pembicara …", ["membebaskan audiens dari tanggung jawab memperbaiki tulisan", "hanya menyindir siswa yang pernah salah menulis surel", "menganggap dirinya lebih mahir menulis daripada seluruh audiens", "menempatkan dirinya sebagai bagian dari audiens yang berbenah", "mewakili pihak sekolah yang memberikan perintah kepada siswa"], 3, "<i>Kita</i> bersifat inklusif, mencakup pembicara dan audiens. Pembicara ikut berada dalam kelompok yang perlu berbenah sehingga ajakan terasa setara dan tidak menggurui."], [24, "Inferensial – Fakta dan Opini", "Dua kalimat yang merupakan <b>opini</b> pembicara dalam pidato tersebut adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Bahasa Indonesia ditetapkan sebagai bahasa negara dalam Undang-Undang Dasar 1945.", "Lamaran kerja pun umumnya dilengkapi daftar riwayat hidup.", "Seorang manajer perekrutan pernah menolak lamaran yang diawali sapaan <i>halo, Bos</i>.", "Saya yakin, pelamar yang menulis dengan rapi pasti lebih cepat diterima.", "Menurut saya, kemampuan menulis lebih penting daripada keterampilan teknis."], {"m": [3, 4]}, "Opini adalah pendapat atau keyakinan pembicara yang ditandai <i>menurut saya</i> dan <i>saya yakin</i>. Penetapan bahasa negara dalam UUD 1945, kelengkapan lamaran, dan peristiwa penolakan lamaran adalah fakta yang dapat diperiksa."], [25, "Evaluasi – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Pembicara membedakan bahasa sehari-hari dengan bahasa yang dipakai di dunia kerja.", "Kisah manajer perekrutan merupakan data statistik tentang banyaknya lamaran yang ditolak.", "Penutup pidato memuat ajakan agar audiens membiasakan diri menulis dengan baik.", "Pembicara menyatakan bahwa keterampilan teknis sama sekali tidak diperlukan."], [1, 0, 1, 0], "1 Sesuai: paragraf kedua menyatakan bahasa sehari-hari berbeda dengan bahasa dunia kerja. 2 Tidak sesuai: kisah itu hanya satu peristiwa (anekdot), bukan data statistik. 3 Sesuai: kalimat penutup berisi ajakan. 4 Tidak sesuai: pembicara hanya berpendapat bahwa menulis lebih penting, bukan menyatakan keterampilan teknis tidak diperlukan sama sekali.", ["Sesuai", "Tidak Sesuai"]]]}], "TIPS": {"1": "Gagasan utama harus mewakili seluruh teks. Periksa apakah pembuka, isi, dan penutup mendukung opsi yang kamu pilih.", "2": "Tanyakan pada diri sendiri: apakah pembicara menunggu jawaban, atau ingin audiens berpikir?", "3": "Klaim yang kuat punya bukti. Periksa apakah teks menyertakan data, angka, atau sumber untuk klaim tersebut.", "4": "Pilih tambahan yang menambah bukti atau cara nyata. Waspadai opsi yang bertentangan dengan pesan pidato itu sendiri.", "5": "Nilai satu pernyataan sekali waktu. Waspadai kata mutlak seperti <i>semua</i> dan <i>pasti</i>, lalu cari buktinya di teks.", "6": "Bandingkan urutan sapaan di draf dengan urutan jabatan dari tertinggi ke umum, lalu periksa pilihan katanya.", "7": "Ide pokok adalah inti yang didukung semua kalimat lain. Bedakan dengan rincian atau solusi yang hanya muncul satu kali.", "8": "Periksa letak paragraf setiap kutipan. Opsi yang benar harus ada di paragraf kedua dan jenis kalimatnya tepat.", "9": "Cek empat unsur penutup (kesimpulan atau ajakan, maaf, salam penutup) dan ragam bahasanya pada setiap opsi.", "10": "Periksa apakah setiap pernyataan benar-benar terbukti di draf, bukan sekadar masuk akal.", "11": "Periksa angka, satuan waktu, dan jenis sampah satu per satu. Satu kata yang berbeda cukup membuat opsi salah.", "12": "Hubungkan bukti dan kesimpulan. Tanyakan: adakah penjelasan lain, dan apakah kata <i>seluruh</i> terbukti?", "13": "Cari inti yang mencakup semua kalimat di paragraf ketiga, bukan satu rincian saja.", "14": "Nilai kelayakan: siapa yang melaksanakan, kapan, dengan biaya dan fasilitas apa? Singkirkan opsi yang tidak realistis.", "15": "Cari bukti di teks untuk tiap pernyataan. Harapan atau janji belum tentu didukung bukti.", "16": "Baca paragraf pertama kalimat demi kalimat dan beri label tiap bagian sebelum melihat opsi.", "17": "Cari apa yang dilakukan lilin, lalu tanyakan sifat manusia apa yang sejajar dengan tindakan itu.", "18": "Cocokkan isi kalimat (ajakan yang menegaskan tekad) dengan gestur dan vokal yang mendukung pesan itu.", "19": "Uji tiap contoh: apakah ia menunjukkan manfaat tanpa mengejar ketenaran? Contoh yang justru mengejar ketenaran tidak relevan.", "20": "Bedakan apa yang tertulis dengan apa yang dibalik maknanya. Cari kalimat bukti pada tiap pernyataan.", "21": "Tentukan makna dari kalimat di sekitar kata itu: apa akibat yang dirasakan pembaca surel?", "22": "Gagasan utama mewakili seluruh teks. Hindari opsi yang hanya rincian atau memutarbalikkan pendapat pembicara.", "23": "Tanyakan: siapa saja yang tercakup oleh kata <i>kita</i>, dan kesan apa yang muncul bagi audiens?", "24": "Fakta dapat dibuktikan. Opini berupa pendapat atau keyakinan dan sering ditandai <i>menurut saya</i> atau <i>saya yakin</i>.", "25": "Bedakan satu kisah dengan data, dan pendapat dengan pernyataan yang lebih ekstrem dari teks."}, "MK": {"1": "gagasan", "2": "kalimat", "3": "penalaran", "4": "evaluasi", "5": "isi", "6": "protokoler", "7": "gagasan", "8": "kalimat", "9": "penutup", "10": "isi", "11": "isi", "12": "penalaran", "13": "gagasan", "14": "evaluasi", "15": "isi", "16": "urutan", "17": "kiasan", "18": "gestur", "19": "penalaran", "20": "isi", "21": "kata", "22": "gagasan", "23": "katagnt", "24": "faktaopini", "25": "isi"}, "NOM": {"Lindungi Data Pribadimu": 1, "Draf Pidato Disiplin Waktu": 2, "Kurangi Plastik, Mulai dari Kantin Kita": 3, "Pahlawan di Zaman Kita": 4, "Bahasa Indonesia, Bekal Kita di Dunia Kerja": 5}}, "B": {"D": [{"t": "Kurangi Plastik, Mulai dari Kantin Kita", "k": "Pidato · Argumentatif", "p": "<b>Kurangi Plastik, Mulai dari Kantin Kita</b>\nAssalamualaikum wr. wb. Yang terhormat Bapak Kepala SMK Telkom Purwokerto, yang saya hormati Bapak/Ibu Guru, dan yang saya banggakan seluruh siswa. Puji syukur kita panjatkan ke hadirat Tuhan Yang Maha Esa. Pada kesempatan ini, saya selaku Ketua OSIS akan berbicara tentang sampah plastik di kantin sekolah kita.\nSetiap jam istirahat, ratusan siswa membeli makanan dan minuman dalam kemasan plastik sekali pakai. Menurut catatan petugas kebersihan, kantin menghasilkan rata-rata 30 kantong besar sampah setiap pekan, dan sebagian besar berupa plastik. Memang, sebagian siswa sudah membuang sampah pada tempatnya. Namun, karena tempat sampah di kantin sering penuh, saya menyimpulkan bahwa seluruh siswa tidak peduli pada lingkungan.\nSampah plastik sulit terurai. Jika dibiarkan, sampah itu dapat menyumbat selokan di sekitar sekolah dan menimbulkan genangan saat hujan. Karena itu, OSIS mengusulkan dua langkah, yaitu membawa botol minum sendiri dan memakai wadah makanan yang dapat dicuci ulang.\nMarilah kita mulai dari diri sendiri. Jangan menunggu orang lain bergerak lebih dahulu! Jika kita bersatu, kantin kita pasti menjadi contoh bagi sekolah lain. Demikian yang dapat saya sampaikan. Mohon maaf atas segala kekurangan. Wassalamualaikum wr. wb.", "q": [[1, "Inferensial – Ide Pokok Paragraf", "Ide pokok paragraf ketiga pidato tersebut adalah …", ["Botol minum sendiri jauh lebih murah daripada air minum dalam kemasan plastik", "Wadah makanan yang dapat dicuci ulang harus dijual di setiap kantin sekolah", "Sampah plastik sulit terurai sehingga perlu dikurangi lewat langkah nyata", "Genangan air saat hujan merupakan masalah paling utama di lingkungan sekolah", "Selokan di sekitar sekolah perlu dibersihkan secara rutin setiap musim hujan tiba"], 2, "Paragraf ketiga memaparkan dampak sampah plastik (sulit terurai, menyumbat selokan) lalu mengusulkan dua langkah untuk menguranginya. Opsi lain hanya mengambil satu rincian atau memuat hal yang tidak dinyatakan."], [2, "Evaluasi – Kelayakan Usulan", "Agar usulan OSIS pada paragraf ketiga lebih meyakinkan dan mudah dilaksanakan, dua tambahan yang paling tepat adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Rincian biaya serta lokasi tempat pengisian air minum", "Jadwal dan penanggung jawab kegiatan membawa botol minum", "Sanksi berat bagi seluruh siswa sejak hari pertama diumumkan", "Kutipan lagu populer tentang keindahan alam", "Larangan membawa makanan dan minuman ke lingkungan sekolah"], {"m": [0, 1]}, "Usulan yang baik harus dapat dilaksanakan: perlu jadwal dan penanggung jawab, serta rincian biaya dan fasilitas pendukung. Larangan membawa makanan tidak sejalan dengan usulan, sanksi menyeluruh tanpa persiapan belum adil, dan kutipan lagu tidak menambah kelayakan usulan."], [3, "Evaluasi – Kesalahan Penalaran", "Kesimpulan <i>seluruh siswa tidak peduli pada lingkungan</i> pada paragraf kedua kurang kuat karena …", ["kesimpulan itu dikemukakan sebelum pembicara menyebut catatan petugas", "kata <i>kita</i> membuat pembicara terlihat tidak netral terhadap audiens", "tempat sampah yang penuh belum tentu menunjukkan semua siswa abai", "pembicara tidak menyebut jumlah siswa yang membeli makanan di kantin", "kesimpulan itu tidak berkaitan dengan masalah sampah plastik di kantin"], 2, "Tempat sampah penuh dapat disebabkan hal lain (jumlah tempat sampah kurang, jadwal pengangkutan), dan teks sendiri menyatakan sebagian siswa sudah membuang sampah pada tempatnya. Kata <i>seluruh</i> membuat kesimpulan menjadi generalisasi berlebihan."], [4, "Tekstual – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Pembicara memakai catatan petugas kebersihan untuk mendukung masalah yang diangkat.", "Dampak pada selokan dijelaskan sebagai akibat dari sampah plastik yang sulit terurai.", "Pernyataan <i>kantin kita pasti menjadi contoh bagi sekolah lain</i> telah didukung bukti yang kuat dalam pidato.", "Pembicara menyarankan siswa menunggu arahan guru sebelum mulai mengurangi plastik."], [1, 1, 0, 0], "1 Sesuai: catatan petugas kebersihan disebut pada paragraf kedua. 2 Sesuai: sampah sulit terurai dan dapat menyumbat selokan. 3 Tidak sesuai: kata <i>pasti</i> hanya harapan tanpa bukti. 4 Tidak sesuai: pembicara justru berkata jangan menunggu orang lain bergerak lebih dahulu.", ["Sesuai", "Tidak Sesuai"]], [5, "Tekstual – Informasi Rinci", "Berdasarkan catatan petugas kebersihan, kondisi sampah di kantin sekolah adalah …", ["rata-rata 30 kantong besar setiap pekan, sebagian besar plastik", "rata-rata 30 kantong besar setiap hari, seluruhnya plastik", "kurang dari 10 kantong besar setiap pekan, hampir tanpa plastik", "rata-rata 30 kantong besar setiap bulan, terutama sisa makanan", "rata-rata 13 kantong kecil setiap pekan, sebagian besar kertas"], 0, "Paragraf kedua menyebut rata-rata 30 kantong besar setiap pekan dan sebagian besar berupa plastik. Opsi lain mengubah satuan waktu, jumlah, atau jenis sampah."]]}, {"t": "Bahasa Indonesia, Bekal Kita di Dunia Kerja", "k": "Pidato · Argumentatif", "p": "<b>Bahasa Indonesia, Bekal Kita di Dunia Kerja</b>\nAssalamualaikum wr. wb. Yang terhormat Bapak Kepala Sekolah dan Bapak/Ibu Guru, serta yang saya banggakan teman-teman sekalian. Puji syukur kita panjatkan kepada Tuhan Yang Maha Esa. Pada kesempatan ini, saya ingin berbicara tentang pentingnya kemampuan berbahasa Indonesia bagi calon pekerja seperti kita.\nBanyak orang menganggap bahasa Indonesia mudah karena kita memakainya setiap hari. Padahal, bahasa sehari-hari berbeda dengan bahasa di dunia kerja. Surel lamaran yang penuh singkatan dan salah ketik membuat pembaca ragu sehingga dapat menurunkan kredibilitas pelamar. Seorang manajer perekrutan pernah menolak lamaran yang diawali sapaan <i>halo, Bos</i>.\nBahasa Indonesia ditetapkan sebagai bahasa negara dalam Undang-Undang Dasar 1945. Menurut saya, kemampuan menulis lebih penting daripada keterampilan teknis. Saya yakin, pelamar yang menulis dengan rapi pasti lebih cepat diterima. Lamaran kerja pun umumnya dilengkapi daftar riwayat hidup.\nJika kita ingin dipercaya, kita harus membiasakan diri menulis dengan baik mulai sekarang. Demikian yang dapat saya sampaikan. Mohon maaf atas segala kekhilafan. Wassalamualaikum wr. wb.", "q": [[6, "Inferensial – Kata Ganti", "Pemakaian kata <i>kita</i> pada kalimat <i>Jika kita ingin dipercaya, kita harus membiasakan diri menulis dengan baik</i> menunjukkan bahwa pembicara …", ["mewakili pihak sekolah yang memberikan perintah kepada siswa", "hanya menyindir siswa yang pernah salah menulis surel", "menganggap dirinya lebih mahir menulis daripada seluruh audiens", "membebaskan audiens dari tanggung jawab memperbaiki tulisan", "menempatkan dirinya sebagai bagian dari audiens yang berbenah"], 4, "<i>Kita</i> bersifat inklusif, mencakup pembicara dan audiens. Pembicara ikut berada dalam kelompok yang perlu berbenah sehingga ajakan terasa setara dan tidak menggurui."], [7, "Tekstual – Gagasan Utama", "Gagasan utama pidato tersebut adalah …", ["Aturan menyusun daftar riwayat hidup yang menarik", "Sejarah penetapan bahasa Indonesia sebagai bahasa negara", "Keterampilan teknis tidak lagi diperlukan dalam bekerja", "Cara menulis surel lamaran dengan singkatan yang tepat", "Kemampuan berbahasa Indonesia penting bagi calon pekerja"], 4, "Pembuka, isi, dan penutup berpusat pada pentingnya berbahasa dan menulis dengan baik untuk dunia kerja. Opsi lain hanya rincian (UUD 1945, daftar riwayat hidup), tidak dinyatakan (singkatan yang tepat), atau memutarbalikkan pendapat pembicara."], [8, "Tekstual – Makna Kata", "Makna kata <i>kredibilitas</i> dalam kalimat <i>…dapat menurunkan kredibilitas pelamar</i> adalah …", ["jumlah pengalaman kerja yang pernah dimiliki pelamar", "kemampuan berbicara lancar di hadapan banyak orang", "kerapian penampilan pelamar saat menjalani wawancara", "tingkat kepercayaan orang lain terhadap seseorang", "kecepatan seseorang dalam mengetik surat lamaran"], 3, "Kalimat itu menyebut surel penuh singkatan dan salah ketik membuat pembaca ragu. Maka <i>kredibilitas</i> berarti tingkat kepercayaan orang lain terhadap pelamar."], [9, "Evaluasi – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Pembicara membedakan bahasa sehari-hari dengan bahasa yang dipakai di dunia kerja.", "Kisah manajer perekrutan merupakan data statistik tentang banyaknya lamaran yang ditolak.", "Penutup pidato memuat ajakan agar audiens membiasakan diri menulis dengan baik.", "Pembicara menyatakan bahwa keterampilan teknis sama sekali tidak diperlukan."], [1, 0, 1, 0], "1 Sesuai: paragraf kedua menyatakan bahasa sehari-hari berbeda dengan bahasa dunia kerja. 2 Tidak sesuai: kisah itu hanya satu peristiwa (anekdot), bukan data statistik. 3 Sesuai: kalimat penutup berisi ajakan. 4 Tidak sesuai: pembicara hanya berpendapat bahwa menulis lebih penting, bukan menyatakan keterampilan teknis tidak diperlukan sama sekali.", ["Sesuai", "Tidak Sesuai"]], [10, "Inferensial – Fakta dan Opini", "Dua kalimat yang merupakan <b>opini</b> pembicara dalam pidato tersebut adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Saya yakin, pelamar yang menulis dengan rapi pasti lebih cepat diterima.", "Lamaran kerja pun umumnya dilengkapi daftar riwayat hidup.", "Bahasa Indonesia ditetapkan sebagai bahasa negara dalam Undang-Undang Dasar 1945.", "Menurut saya, kemampuan menulis lebih penting daripada keterampilan teknis.", "Seorang manajer perekrutan pernah menolak lamaran yang diawali sapaan <i>halo, Bos</i>."], {"m": [0, 3]}, "Opini adalah pendapat atau keyakinan pembicara yang ditandai <i>menurut saya</i> dan <i>saya yakin</i>. Penetapan bahasa negara dalam UUD 1945, kelengkapan lamaran, dan peristiwa penolakan lamaran adalah fakta yang dapat diperiksa."]]}, {"t": "Lindungi Data Pribadimu", "k": "Pidato · Persuasif", "p": "<b>Lindungi Data Pribadimu, Lindungi Masa Depanmu</b>\nAssalamualaikum wr. wb. Yang terhormat Bapak Kepala SMK Telkom Purwokerto, yang saya hormati Bapak/Ibu Guru, serta yang saya banggakan teman-teman sekalian. Puji syukur kita panjatkan ke hadirat Tuhan Yang Maha Esa atas rahmat-Nya sehingga kita dapat berkumpul di sini. Pada kesempatan ini, izinkan saya menyampaikan pidato tentang pentingnya menjaga keamanan data pribadi di era digital.\nTeman-teman, setiap hari kita membagikan nama, foto, dan lokasi di media sosial tanpa berpikir panjang. Padahal, kebocoran data pribadi terus meningkat dan sering dimanfaatkan untuk penipuan. Satu tautan palsu atau <i>phishing</i> dapat membuat akun kita diambil alih orang lain. Sebagai contoh, seorang siswa kehilangan akun gim karena mengeklik hadiah palsu. Apakah kita mau menjadi korban berikutnya?\nOleh karena itu, mari kita biasakan menggunakan kata sandi yang kuat dan mengaktifkan autentikasi dua faktor. Jangan sembarangan membagikan kode verifikasi kepada siapa pun! Kita harus menyadari bahwa data pribadi sama berharganya dengan uang di dalam dompet.\nDemikian yang dapat saya sampaikan. Intinya, lindungi data pribadi sebelum terlambat. Mohon maaf atas segala kekhilafan. Wassalamualaikum wr. wb.", "q": [[11, "Evaluasi – Kelemahan Argumen", "Pernyataan <i>kebocoran data pribadi terus meningkat</i> pada paragraf kedua belum sepenuhnya meyakinkan karena …", ["tidak berkaitan dengan topik keamanan data pribadi", "hanya berlaku bagi siswa yang bermain gim daring", "tidak disertai data atau sumber yang dapat diperiksa", "disampaikan dengan bahasa yang terlalu baku dan kaku", "bertentangan dengan ajakan pada paragraf ketiga"], 2, "Klaim tentang kecenderungan baru kuat bila ada angka atau sumber. Teks tidak memuatnya, sehingga klaim itu masih berupa pengakuan pembicara. Klaim itu tetap relevan dengan topik dan tidak bertentangan dengan paragraf ketiga."], [12, "Inferensial – Fungsi Kalimat Retoris", "Kalimat tanya <i>Apakah kita mau menjadi korban berikutnya?</i> pada paragraf kedua berfungsi …", ["menyindir siswa yang ceroboh mengeklik hadiah palsu", "menanyakan siapa saja yang pernah kehilangan akun gim", "menyimpulkan seluruh isi pidato sebelum bagian penutup", "meminta audiens menjawab pertanyaan itu secara lisan", "mendorong audiens membayangkan risiko bagi dirinya"], 4, "Kalimat retoris tidak menuntut jawaban. Ditempatkan setelah contoh kasus, kalimat ini membuat risiko terasa dekat dan mengajak audiens merenung. Pembicara tidak menanyakan siapa korbannya dan tidak menyindir siapa pun."], [13, "Evaluasi – Penguatan Argumen", "Agar ajakan pada paragraf ketiga lebih meyakinkan, dua tambahan yang paling tepat adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Daftar nama siswa yang pernah menjadi korban penipuan", "Langkah praktis mengenali tautan palsu sebelum diklik", "Pengulangan salam pembuka agar audiens lebih tenang", "Cerita lucu tentang kebiasaan berswafoto di sekolah", "Data kasus penipuan daring dari lembaga resmi"], {"m": [1, 4]}, "Ajakan menjadi kuat bila ditopang bukti (data resmi) dan cara yang dapat dilakukan (langkah praktis). Cerita lucu dan pengulangan salam tidak menambah daya yakin, sedangkan menyebut nama korban justru melanggar pesan pidato tentang menjaga data pribadi."], [14, "Tekstual – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Pembicara menyimpulkan bahwa semua pengguna media sosial pasti tertipu berdasarkan satu contoh siswa.", "Anjuran pada paragraf ketiga disampaikan sebagai tindak lanjut atas masalah pada paragraf kedua.", "Pidato memuat angka statistik kebocoran data pribadi secara rinci.", "Perbandingan data pribadi dengan uang di dalam dompet menekankan bahwa data harus dijaga."], [0, 1, 0, 1], "1 Tidak sesuai: pembicara hanya memberi satu contoh dan tidak menyimpulkan bahwa semua pengguna pasti tertipu. 2 Sesuai: <i>oleh karena itu</i> menandai anjuran sebagai tindak lanjut masalah. 3 Tidak sesuai: teks tidak memuat angka. 4 Sesuai: perbandingan dengan uang di dompet menekankan nilai data.", ["Sesuai", "Tidak Sesuai"]], [15, "Tekstual – Gagasan Utama", "Gagasan utama pidato tersebut adalah …", ["Pentingnya menjaga data pribadi di dunia digital", "Cara memilih akun media sosial yang menarik bagi pengikut", "Kewajiban sekolah menyediakan jaringan internet gratis", "Manfaat autentikasi dua faktor bagi perusahaan besar", "Risiko kecanduan gim daring pada pelajar SMK"], 0, "Pengantar topik pada paragraf pertama dan kalimat penutup <i>lindungi data pribadi sebelum terlambat</i> sama-sama menegaskan inti pidato. Opsi lain hanya menyentuh rincian atau topik di luar teks."]]}, {"t": "Pahlawan di Zaman Kita", "k": "Pidato · Inspiratif", "p": "<b>Pahlawan di Zaman Kita</b>\nSelamat pagi dan salam sejahtera bagi kita semua. Yang terhormat Bapak Kepala Sekolah, yang saya hormati Bapak/Ibu Guru, dan yang saya sayangi teman-teman. Puji syukur kita panjatkan ke hadirat Tuhan Yang Maha Esa. Dalam rangka Hari Pahlawan, izinkan saya mengajak kita merenungkan arti pahlawan pada zaman ini.\nPara pejuang dahulu mempertaruhkan nyawa agar bangsa ini merdeka. Kini kita tidak lagi mengangkat senjata, tetapi perjuangan belum selesai, sebab kita masih harus melawan kemalasan, kebodohan, dan ketidakjujuran. Pahlawan bagaikan lilin yang menerangi ruangan dengan membakar dirinya sendiri.\nPahlawan masa kini ada di sekitar kita. Petugas kebersihan yang berangkat sebelum subuh agar jalan menuju sekolah bersih adalah pahlawan. Teman yang mau menjelaskan pelajaran kepada temannya yang tertinggal juga pahlawan. Kita pun dapat menjadi pahlawan jika berani jujur saat ulangan, meskipun tidak ada yang mengawasi.\nMarilah kita tanamkan tekad sejak sekarang. Tidak perlu menunggu besar untuk berbuat baik! Pahlawan sejati bukan orang yang paling dikenal, melainkan orang yang paling bermanfaat. Terima kasih atas perhatian Bapak, Ibu, dan teman-teman. Salam sejahtera.", "q": [[16, "Inferensial – Makna Perumpamaan", "Perumpamaan <i>lilin yang menerangi ruangan dengan membakar dirinya sendiri</i> menggambarkan sikap pahlawan yang …", ["bekerja sendirian tanpa mau dibantu oleh siapa pun", "gemar memamerkan jasanya agar mendapat pujian orang", "menyerah ketika tenaganya habis terpakai bekerja", "hanya peduli pada keselamatan dirinya sendiri saja", "rela berkorban untuk kebaikan orang di sekitarnya"], 4, "Lilin memberi terang dengan mengorbankan dirinya. Perbandingan itu memaknai pahlawan sebagai orang yang rela berkorban demi orang lain. Sikap pamer, menyerah, atau mementingkan diri bertentangan dengan makna tersebut."], [17, "Evaluasi – Relevansi Contoh", "Pernyataan <i>Pahlawan sejati bukan orang yang paling dikenal, melainkan orang yang paling bermanfaat</i> paling didukung oleh dua contoh berikut … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Petugas kebersihan yang berangkat sebelum subuh tanpa sorotan", "Siswa yang membagikan foto kebaikannya agar mendapat banyak suka", "Siswa yang membantu temannya yang tertinggal pelajaran", "Tokoh terkenal yang sering tampil di televisi dan media sosial", "Pejabat yang namanya dipasang pada papan peresmian gedung baru"], {"m": [0, 2]}, "Pernyataan itu menekankan manfaat, bukan ketenaran. Petugas kebersihan dan siswa yang membantu temannya bermanfaat tanpa mengejar sorotan. Tokoh terkenal, pejabat dengan papan peresmian, dan siswa yang memamerkan kebaikan justru menonjolkan ketenaran."], [18, "Inferensial – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Contoh petugas kebersihan dan teman yang membantu dipakai untuk menunjukkan bahwa pahlawan ada di sekitar kita.", "Pembicara berpendapat bahwa perjuangan para pahlawan telah berakhir setelah kemerdekaan.", "Kejujuran saat ulangan dianggap bukan bentuk kepahlawanan karena tidak dilihat orang lain.", "Pembicara mengajak audiens menanamkan tekad sejak sekarang tanpa menunggu dewasa."], [1, 0, 0, 1], "1 Sesuai: contoh itu ada pada paragraf ketiga. 2 Tidak sesuai: pembicara menyatakan perjuangan belum selesai. 3 Tidak sesuai: kejujuran saat ulangan justru disebut sebagai contoh pahlawan. 4 Sesuai: pembicara mengajak menanamkan tekad sejak sekarang dan tidak perlu menunggu besar.", ["Sesuai", "Tidak Sesuai"]], [19, "Tekstual – Urutan Pembuka", "Urutan bagian pembuka pidato tersebut yang benar adalah …", ["Salam – puji syukur – sapaan – pengantar topik", "Salam – sapaan – pengantar topik – puji syukur", "Salam – sapaan – puji syukur – pengantar topik", "Sapaan – salam – puji syukur – pengantar topik", "Puji syukur – salam – sapaan – pengantar topik"], 2, "Paragraf pertama dimulai dengan salam (<i>selamat pagi dan salam sejahtera</i>), disusul sapaan kepada kepala sekolah, guru, dan teman-teman, lalu puji syukur, dan diakhiri pengantar topik tentang Hari Pahlawan."], [20, "Evaluasi – Gestur dan Vokal", "Saat mengucapkan kalimat <i>Tidak perlu menunggu besar untuk berbuat baik!</i>, gestur dan vokal yang paling tepat adalah …", ["Membaca naskah tanpa jeda dengan suara datar dan sangat rendah", "Kepalan ringan, intonasi tegas, dan pandangan menyapu audiens", "Menunjuk satu siswa dengan jari sambil berbicara dengan marah", "Tangan menyilang di dada, tempo sangat cepat, dan wajah datar", "Tangan di saku, suara pelan, dan pandangan menunduk ke lantai"], 1, "Kalimat ini berisi ajakan yang menegaskan tekad. Kepalan ringan, intonasi tegas, dan kontak mata yang menyapu audiens menguatkan pesan tanpa menyudutkan siapa pun. Opsi lain menunjukkan keraguan, kemarahan, atau sikap tertutup."]]}, {"t": "Draf Pidato Disiplin Waktu", "k": "Pidato · Draf Siswa", "p": "<b>Draf Pidato Lomba: Disiplin Waktu</b>\nHai teman-teman, yang saya cintai Bapak Kepala Sekolah, dan Bapak Guru. Hari ini saya mau ngomongin disiplin waktu.\nBanyak siswa datang terlambat karena begadang. Akibatnya, pelajaran pertama sering terlewat dan nilai menurun. Bukankah kita ingin lulus dengan prestasi yang membanggakan? Marilah kita tiba di sekolah sebelum bel berbunyi dan tidur lebih awal. Kita pasti bisa!\nUdah ya, itu aja dari saya. Makasih.", "q": [[21, "Evaluasi – Kesesuaian Draf", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan tentang draf pidato!", ["Pembuka draf sudah memuat salam, sapaan protokoler, puji syukur, dan pengantar topik.", "Kata <i>kita</i> pada <i>Marilah kita</i> menyertakan pembicara bersama audiens.", "Kalimat <i>Bukankah kita ingin lulus dengan prestasi yang membanggakan?</i> mengajak audiens berpikir tanpa menuntut jawaban.", "Pernyataan <i>nilai menurun</i> sudah didukung data nilai siswa yang sering terlambat."], [0, 1, 1, 0], "1 Tidak sesuai: salam dan puji syukur tidak ada, dan sapaan belum berurutan. 2 Sesuai: <i>kita</i> bersifat inklusif. 3 Sesuai: kalimat tanya itu retoris. 4 Tidak sesuai: draf tidak memuat data nilai, hanya pernyataan.", ["Sesuai", "Tidak Sesuai"]], [22, "Tekstual – Unsur Kebahasaan", "Dua pernyataan tentang unsur kebahasaan yang tepat berdasarkan paragraf kedua draf adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Terdapat kalimat imperatif <i>Marilah kita tiba di sekolah sebelum bel berbunyi</i>", "Terdapat kata ganti orang ketiga pada kata <i>kita</i> dalam kalimat <i>Marilah kita tiba</i>", "Terdapat kalimat retoris <i>Bukankah kita ingin lulus dengan prestasi yang membanggakan?</i>", "Terdapat sapaan akrab <i>hai</i> pada kalimat pembuka paragraf kedua ini", "Terdapat bahasa tidak baku pada kalimat <i>Hari ini saya mau ngomongin disiplin waktu</i> di paragraf ini"], {"m": [0, 2]}, "Kalimat tanya yang tidak menuntut jawaban adalah kalimat retoris, dan <i>marilah</i> menandai ajakan (imperatif). <i>Ngomongin</i> dan <i>hai</i> berada pada paragraf pertama, bukan paragraf kedua, sedangkan <i>kita</i> adalah kata ganti orang pertama jamak inklusif."], [23, "Inferensial – Ide Pokok Paragraf", "Ide pokok paragraf kedua draf tersebut adalah …", ["Guru wajib menertibkan siswa yang datang terlambat", "Bel sekolah sebaiknya dibunyikan lebih awal setiap hari", "Nilai siswa menurun karena materi pelajaran terlalu sulit", "Keterlambatan akibat begadang merugikan prestasi siswa", "Siswa perlu tidur lebih awal agar tubuhnya tetap sehat"], 3, "Paragraf kedua bergerak dari masalah (terlambat karena begadang) ke akibat (pelajaran terlewat, nilai menurun), lalu ajakan. Semuanya mendukung satu ide: keterlambatan akibat begadang merugikan prestasi. Tidur lebih awal hanya salah satu solusi pendukung."], [24, "Evaluasi – Perbaikan Penutup", "Penutup yang paling tepat untuk menggantikan <i>Udah ya, itu aja dari saya. Makasih.</i> adalah …", ["Sekian pidato saya. Semoga siswa yang suka terlambat segera sadar dan berubah. Terima kasih, silakan bertepuk tangan, ya.", "Demikian yang dapat saya sampaikan. Mari kita disiplin waktu mulai hari ini. Mohon maaf atas kekhilafan. Wassalamualaikum wr. wb.", "Cukup sekian dan terima kasih. Jangan lupa tidur lebih awal supaya tidak terlambat. Kalau ada salah kata, mohon dimaklumi.", "Intinya, disiplin waktu itu penting banget buat kita semua. Sekian dari saya, sampai ketemu lagi. Wassalamualaikum wr. wb.", "Demikian yang dapat saya sampaikan. Terima kasih atas perhatian Bapak, Ibu, dan teman-teman sekalian. Mohon maaf atas kekhilafan."], 1, "Penutup baku memuat kesimpulan atau ajakan, permohonan maaf, dan salam penutup dengan bahasa formal. Opsi lain tidak lengkap (tanpa ajakan atau salam penutup), masih memakai bahasa tidak formal, atau menyudutkan siswa tertentu."], [25, "Tekstual – Kesalahan Pembuka", "Kesalahan yang paling jelas pada sapaan di bagian pembuka draf pidato tersebut adalah …", ["Sapaan terlalu panjang sehingga topik pidato baru disebut pada bagian akhir", "Sapaan tidak berurutan dari jabatan tertinggi dan memakai kata tidak formal", "Sapaan tidak memuat nama sekolah tempat lomba pidato itu diselenggarakan", "Sapaan hanya ditujukan kepada kepala sekolah dan guru, tanpa menyapa audiens lain", "Sapaan memakai bahasa daerah yang tidak dikenal oleh sebagian besar audiens"], 1, "Kata <i>teman-teman</i> disebut lebih dulu daripada <i>Bapak Kepala Sekolah</i> dan <i>Bapak Guru</i> (urutan terbalik), serta dipakai kata <i>hai</i> dan <i>ngomongin</i> yang tidak formal. Sapaan itu tetap menyapa audiens dan topik sudah disebut di kalimat berikutnya."]]}], "TIPS": {"1": "Cari inti yang mencakup semua kalimat di paragraf ketiga, bukan satu rincian saja.", "2": "Nilai kelayakan: siapa yang melaksanakan, kapan, dengan biaya dan fasilitas apa? Singkirkan opsi yang tidak realistis.", "3": "Hubungkan bukti dan kesimpulan. Tanyakan: adakah penjelasan lain, dan apakah kata <i>seluruh</i> terbukti?", "4": "Cari bukti di teks untuk tiap pernyataan. Harapan atau janji belum tentu didukung bukti.", "5": "Periksa angka, satuan waktu, dan jenis sampah satu per satu. Satu kata yang berbeda cukup membuat opsi salah.", "6": "Tanyakan: siapa saja yang tercakup oleh kata <i>kita</i>, dan kesan apa yang muncul bagi audiens?", "7": "Gagasan utama mewakili seluruh teks. Hindari opsi yang hanya rincian atau memutarbalikkan pendapat pembicara.", "8": "Tentukan makna dari kalimat di sekitar kata itu: apa akibat yang dirasakan pembaca surel?", "9": "Bedakan satu kisah dengan data, dan pendapat dengan pernyataan yang lebih ekstrem dari teks.", "10": "Fakta dapat dibuktikan. Opini berupa pendapat atau keyakinan dan sering ditandai <i>menurut saya</i> atau <i>saya yakin</i>.", "11": "Klaim yang kuat punya bukti. Periksa apakah teks menyertakan data, angka, atau sumber untuk klaim tersebut.", "12": "Tanyakan pada diri sendiri: apakah pembicara menunggu jawaban, atau ingin audiens berpikir?", "13": "Pilih tambahan yang menambah bukti atau cara nyata. Waspadai opsi yang bertentangan dengan pesan pidato itu sendiri.", "14": "Nilai satu pernyataan sekali waktu. Waspadai kata mutlak seperti <i>semua</i> dan <i>pasti</i>, lalu cari buktinya di teks.", "15": "Gagasan utama harus mewakili seluruh teks. Periksa apakah pembuka, isi, dan penutup mendukung opsi yang kamu pilih.", "16": "Cari apa yang dilakukan lilin, lalu tanyakan sifat manusia apa yang sejajar dengan tindakan itu.", "17": "Uji tiap contoh: apakah ia menunjukkan manfaat tanpa mengejar ketenaran? Contoh yang justru mengejar ketenaran tidak relevan.", "18": "Bedakan apa yang tertulis dengan apa yang dibalik maknanya. Cari kalimat bukti pada tiap pernyataan.", "19": "Baca paragraf pertama kalimat demi kalimat dan beri label tiap bagian sebelum melihat opsi.", "20": "Cocokkan isi kalimat (ajakan yang menegaskan tekad) dengan gestur dan vokal yang mendukung pesan itu.", "21": "Periksa apakah setiap pernyataan benar-benar terbukti di draf, bukan sekadar masuk akal.", "22": "Periksa letak paragraf setiap kutipan. Opsi yang benar harus ada di paragraf kedua dan jenis kalimatnya tepat.", "23": "Ide pokok adalah inti yang didukung semua kalimat lain. Bedakan dengan rincian atau solusi yang hanya muncul satu kali.", "24": "Cek empat unsur penutup (kesimpulan atau ajakan, maaf, salam penutup) dan ragam bahasanya pada setiap opsi.", "25": "Bandingkan urutan sapaan di draf dengan urutan jabatan dari tertinggi ke umum, lalu periksa pilihan katanya."}, "MK": {"1": "gagasan", "2": "evaluasi", "3": "penalaran", "4": "isi", "5": "isi", "6": "katagnt", "7": "gagasan", "8": "kata", "9": "isi", "10": "faktaopini", "11": "penalaran", "12": "kalimat", "13": "evaluasi", "14": "isi", "15": "gagasan", "16": "kiasan", "17": "penalaran", "18": "isi", "19": "urutan", "20": "gestur", "21": "isi", "22": "kalimat", "23": "gagasan", "24": "penutup", "25": "protokoler"}, "NOM": {"Kurangi Plastik, Mulai dari Kantin Kita": 1, "Bahasa Indonesia, Bekal Kita di Dunia Kerja": 2, "Lindungi Data Pribadimu": 3, "Pahlawan di Zaman Kita": 4, "Draf Pidato Disiplin Waktu": 5}}, "C": {"D": [{"t": "Bahasa Indonesia, Bekal Kita di Dunia Kerja", "k": "Pidato · Argumentatif", "p": "<b>Bahasa Indonesia, Bekal Kita di Dunia Kerja</b>\nAssalamualaikum wr. wb. Yang terhormat Bapak Kepala Sekolah dan Bapak/Ibu Guru, serta yang saya banggakan teman-teman sekalian. Puji syukur kita panjatkan kepada Tuhan Yang Maha Esa. Pada kesempatan ini, saya ingin berbicara tentang pentingnya kemampuan berbahasa Indonesia bagi calon pekerja seperti kita.\nBanyak orang menganggap bahasa Indonesia mudah karena kita memakainya setiap hari. Padahal, bahasa sehari-hari berbeda dengan bahasa di dunia kerja. Surel lamaran yang penuh singkatan dan salah ketik membuat pembaca ragu sehingga dapat menurunkan kredibilitas pelamar. Seorang manajer perekrutan pernah menolak lamaran yang diawali sapaan <i>halo, Bos</i>.\nBahasa Indonesia ditetapkan sebagai bahasa negara dalam Undang-Undang Dasar 1945. Menurut saya, kemampuan menulis lebih penting daripada keterampilan teknis. Saya yakin, pelamar yang menulis dengan rapi pasti lebih cepat diterima. Lamaran kerja pun umumnya dilengkapi daftar riwayat hidup.\nJika kita ingin dipercaya, kita harus membiasakan diri menulis dengan baik mulai sekarang. Demikian yang dapat saya sampaikan. Mohon maaf atas segala kekhilafan. Wassalamualaikum wr. wb.", "q": [[1, "Tekstual – Makna Kata", "Makna kata <i>kredibilitas</i> dalam kalimat <i>…dapat menurunkan kredibilitas pelamar</i> adalah …", ["kerapian penampilan pelamar saat menjalani wawancara", "kecepatan seseorang dalam mengetik surat lamaran", "tingkat kepercayaan orang lain terhadap seseorang", "kemampuan berbicara lancar di hadapan banyak orang", "jumlah pengalaman kerja yang pernah dimiliki pelamar"], 2, "Kalimat itu menyebut surel penuh singkatan dan salah ketik membuat pembaca ragu. Maka <i>kredibilitas</i> berarti tingkat kepercayaan orang lain terhadap pelamar."], [2, "Inferensial – Kata Ganti", "Pemakaian kata <i>kita</i> pada kalimat <i>Jika kita ingin dipercaya, kita harus membiasakan diri menulis dengan baik</i> menunjukkan bahwa pembicara …", ["menempatkan dirinya sebagai bagian dari audiens yang berbenah", "menganggap dirinya lebih mahir menulis daripada seluruh audiens", "mewakili pihak sekolah yang memberikan perintah kepada siswa", "hanya menyindir siswa yang pernah salah menulis surel", "membebaskan audiens dari tanggung jawab memperbaiki tulisan"], 0, "<i>Kita</i> bersifat inklusif, mencakup pembicara dan audiens. Pembicara ikut berada dalam kelompok yang perlu berbenah sehingga ajakan terasa setara dan tidak menggurui."], [3, "Inferensial – Fakta dan Opini", "Dua kalimat yang merupakan <b>opini</b> pembicara dalam pidato tersebut adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Lamaran kerja pun umumnya dilengkapi daftar riwayat hidup.", "Seorang manajer perekrutan pernah menolak lamaran yang diawali sapaan <i>halo, Bos</i>.", "Menurut saya, kemampuan menulis lebih penting daripada keterampilan teknis.", "Saya yakin, pelamar yang menulis dengan rapi pasti lebih cepat diterima.", "Bahasa Indonesia ditetapkan sebagai bahasa negara dalam Undang-Undang Dasar 1945."], {"m": [2, 3]}, "Opini adalah pendapat atau keyakinan pembicara yang ditandai <i>menurut saya</i> dan <i>saya yakin</i>. Penetapan bahasa negara dalam UUD 1945, kelengkapan lamaran, dan peristiwa penolakan lamaran adalah fakta yang dapat diperiksa."], [4, "Evaluasi – Sesuai/Tidak Sesuai", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan berikut berdasarkan teks!", ["Pembicara membedakan bahasa sehari-hari dengan bahasa yang dipakai di dunia kerja.", "Kisah manajer perekrutan merupakan data statistik tentang banyaknya lamaran yang ditolak.", "Penutup pidato memuat ajakan agar audiens membiasakan diri menulis dengan baik.", "Pembicara menyatakan bahwa keterampilan teknis sama sekali tidak diperlukan."], [1, 0, 1, 0], "1 Sesuai: paragraf kedua menyatakan bahasa sehari-hari berbeda dengan bahasa dunia kerja. 2 Tidak sesuai: kisah itu hanya satu peristiwa (anekdot), bukan data statistik. 3 Sesuai: kalimat penutup berisi ajakan. 4 Tidak sesuai: pembicara hanya berpendapat bahwa menulis lebih penting, bukan menyatakan keterampilan teknis tidak diperlukan sama sekali.", ["Sesuai", "Tidak Sesuai"]], [5, "Tekstual – Gagasan Utama", "Gagasan utama pidato tersebut adalah …", ["Keterampilan teknis tidak lagi diperlukan dalam bekerja", "Cara menulis surel lamaran dengan singkatan yang tepat", "Sejarah penetapan bahasa Indonesia sebagai bahasa negara", "Aturan menyusun daftar riwayat hidup yang menarik", "Kemampuan berbahasa Indonesia penting bagi calon pekerja"], 4, "Pembuka, isi, dan penutup berpusat pada pentingnya berbahasa dan menulis dengan baik untuk dunia kerja. Opsi lain hanya rincian (UUD 1945, daftar riwayat hidup), tidak dinyatakan (singkatan yang tepat), atau memutarbalikkan pendapat pembicara."]]}, {"t": "Draf Pidato Disiplin Waktu", "k": "Pidato · Draf Siswa", "p": "<b>Draf Pidato Lomba: Disiplin Waktu</b>\nHai teman-teman, yang saya cintai Bapak Kepala Sekolah, dan Bapak Guru. Hari ini saya mau ngomongin disiplin waktu.\nBanyak siswa datang terlambat karena begadang. Akibatnya, pelajaran pertama sering terlewat dan nilai menurun. Bukankah kita ingin lulus dengan prestasi yang membanggakan? Marilah kita tiba di sekolah sebelum bel berbunyi dan tidur lebih awal. Kita pasti bisa!\nUdah ya, itu aja dari saya. Makasih.", "q": [[6, "Tekstual – Unsur Kebahasaan", "Dua pernyataan tentang unsur kebahasaan yang tepat berdasarkan paragraf kedua draf adalah … <span class=\"mnote\">Pilih 2 jawaban!</span>", ["Terdapat sapaan akrab <i>hai</i> pada kalimat pembuka paragraf kedua ini", "Terdapat kalimat retoris <i>Bukankah kita ingin lulus dengan prestasi yang membanggakan?</i>", "Terdapat kalimat imperatif <i>Marilah kita tiba di sekolah sebelum bel berbunyi</i>", "Terdapat bahasa tidak baku pada kalimat <i>Hari ini saya mau ngomongin disiplin waktu</i> di paragraf ini", "Terdapat kata ganti orang ketiga pada kata <i>kita</i> dalam kalimat <i>Marilah kita tiba</i>"], {"m": [1, 2]}, "Kalimat tanya yang tidak menuntut jawaban adalah kalimat retoris, dan <i>marilah</i> menandai ajakan (imperatif). <i>Ngomongin</i> dan <i>hai</i> berada pada paragraf pertama, bukan paragraf kedua, sedangkan <i>kita</i> adalah kata ganti orang pertama jamak inklusif."], [7, "Evaluasi – Kesesuaian Draf", "Tentukan <b>Sesuai</b> atau <b>Tidak Sesuai</b> untuk setiap pernyataan tentang draf pidato!", ["Pembuka draf sudah memuat salam, sapaan protokoler, puji syukur, dan pengantar topik.", "Kata <i>kita</i> pada <i>Marilah kita</i> menyertakan pembicara bersama audiens.", "Kalimat <i>Bukankah kita ingin lulus dengan prestasi yang membanggakan?</i> mengajak audiens berpikir tanpa menuntut jawaban.", "Pernyataan <i>nilai menurun</i> sudah didukung data nilai siswa yang sering terlambat."], [0, 1, 1, 0], "1 Tidak sesuai: salam dan puji syukur tidak ada, dan sapaan belum berurutan. 2 Sesuai: <i>kita</i> bersifat inklusif. 3 Sesuai: kalimat tanya itu retoris. 4 Tidak sesuai: draf tidak memuat data nilai, hanya pernyataan.", ["Sesuai", "Tidak Sesuai"]], [8, "Tekstual – Kesalahan Pembuka", "Kesalahan yang paling jelas pada sapaan di bagian pembuka draf pidato tersebut adalah …", ["Sapaan tidak berurutan dari jabatan tertinggi dan memakai kata tidak formal", "Sapaan tidak memuat nama sekolah tempat lomba pidato itu diselenggarakan", "Sapaan hanya ditujukan kepada kepala sekolah dan guru, tanpa menyapa audiens lain", "Sapaan memakai bahasa daerah yang tidak dikenal oleh sebagian besar audiens", "Sapaan terlalu panjang sehingga topik pidato baru disebut pada bagian akhir"], 0, "Kata <i>teman-teman</i> disebut lebih dulu daripada <i>Bapak Kepala Sekolah</i> dan <i>Bapak Guru</i> (urutan terbalik), serta dipakai kata <i>hai</i> dan <i>ngomongin</i> yang tidak formal. Sapaan itu tetap menyapa audiens dan topik sudah disebut di kalimat berikutnya."], [9, "Evaluasi – Perbaikan Penutup", "Penutup yang paling tepat untuk menggantikan <i>Udah ya, itu aja dari saya. Makasih.</i> adalah …", ["Demikian yang dapat saya sampaikan. Terima kasih atas perhatian Bapak, Ibu, dan teman-teman sekalian. Mohon maaf atas kekhilafan.", "Demikian yang dapat saya sampaikan. Mari kita disiplin waktu mulai hari ini. Mohon maaf atas kekhilafan. Wassalamualaikum wr. wb.", "Sekian pidato saya. Semoga siswa yang suka terlambat segera sadar dan berubah. Terima kasih, silakan bertepuk tangan, ya.", "Intinya, disiplin waktu itu penting banget buat kita semua. Sekian dari saya, sampai ketemu lagi. Wassalamualaikum wr. wb.", "Cukup sekian dan terima kasih. Jangan lupa tidur lebih awal supaya tidak terlambat. Kalau ada salah kata, mohon dimaklumi."], 1, "Penutup baku memuat kesimpulan atau ajakan, permohonan maaf, dan salam penutup dengan bahasa formal. Opsi lain tidak lengkap (tanpa ajakan atau salam penutup), masih memakai bahasa tidak formal, atau menyudutkan siswa tertentu."], [10, "Inferensial – Ide Pokok Paragraf", "Ide pokok paragraf kedua draf tersebut adalah …", ["Bel sekolah sebaiknya dibunyikan lebih awal setiap hari", "Guru wajib menertibkan siswa yang datang terlambat", "Keterlambatan akibat begadang merugikan prestasi siswa", "Nilai siswa menurun karena materi pelajaran terlalu sulit", "Siswa perlu tidur lebih awal agar tubuhnya tetap sehat"], 2, "Paragraf kedua bergerak dari masalah (terlambat karena begadang) ke akibat (pelajaran terlewat, nilai menurun), lalu ajakan. Semuanya mendukung satu ide: keterlambatan akibat begadang merugikan prestasi. Tidur lebih awal hanya salah satu solusi pendukung."]]}, {"t": "Pahlawan di Zaman Kita", "k": "Pidato · Inspiratif", "p": "<b>Pahlawan di Zaman Kita</b>\nSelamat pagi dan salam sejahtera bagi kita semua. Yang terhormat Bapak Kepala Sekolah, yang saya hormati Bapak/Ibu Guru, dan yang saya sayangi teman-teman. Puji syukur kita panjatkan ke hadirat Tuhan Yang Maha Esa. Dalam rangka Hari Pahlawan, izinkan saya mengajak kita merenungkan arti pahlawan pada zaman ini.\nPara pejuang dahulu mempertaruhkan nyawa agar bangsa ini merdeka. Kini kita tidak lagi mengangkat senjata, tetapi perjuangan belum selesai, sebab kita masih haru
